<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 内联 favicon：不请求任何外部资源，同时避免浏览器产生 404 控制台噪音 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ffffff'/%3E%3Crect x='2' y='9' width='3' height='5' fill='%23440154'/%3E%3Crect x='6.5' y='5' width='3' height='9' fill='%2321918c'/%3E%3Crect x='11' y='2' width='3' height='12' fill='%23fde725'/%3E%3C/svg%3E">
<title>QBot 管理后台</title>
<!--
  QBot 本地管理后台 —— 单文件、零外部依赖、完全离线可用。
  只使用原生 HTML/CSS/JavaScript 与 Canvas 2D，所有图形自行绘制。
  视觉规范：科研论文插图风格（Science / Nature）
    · 白底黑字，连续量一律 viridis 感知均匀色标，分类量用 Okabe-Ito 色盲友好配色
    · 坐标轴 1px #333，去掉上/右边框，刻度线统一朝外，网格线极浅虚线
    · 重绘全部支持 devicePixelRatio 高清屏缩放
-->
<style>
:root{
  --ink:#111;
  --muted:#666;
  --hair:#d9d9d9;
  --hair-soft:#eee;
  --err:#c0392b;
  --ok:#2b7a2b;
  --ink-soft:#333;
  --blue:#0072b2;
  --orange:#d55e00;
  --green:#009e73;
  --purple:#5b3a8e;
  --magenta:#cc79a7;
  --sky:#56b4e9;
  --axis:#333;
  /* viridis 主色阶 */
  --v0:#440154; --v1:#3b528b; --v2:#21918c; --v3:#5ec962; --v4:#fde725;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#fff;
  color:var(--ink);
  font:13px/1.6 "Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 论文式数字排版 */
.num{font-variant-numeric:tabular-nums}
.mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}

/* ---------------------------------------------------------------- 顶部导航 */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:#fff;
  border-bottom:1px solid var(--ink);
  display:flex;align-items:flex-end;gap:22px;
  padding:10px 22px 0 22px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:9px;padding-bottom:8px}
.brand b{font-size:14px;font-weight:600;letter-spacing:.02em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
nav.tabs{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  font:inherit;font-size:13px;color:var(--muted);
  padding:0 1px 8px 1px;cursor:pointer;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

main{max-width:1560px;margin:0 auto;padding:18px 24px 64px 24px}
.foot{max-width:1560px;margin:0 auto;padding:0 24px 40px 24px;color:var(--muted);font-size:11.5px}

/* ------------------------------------------------------------------ 提示条 */
.banner{
  border:1px solid var(--hair);border-left:3px solid var(--ink);
  padding:6px 10px;font-size:12px;margin:0 0 14px 0;background:#fff;
}
.banner.error{border-color:var(--err);border-left-color:var(--err);color:var(--err)}
.banner.ok{border-color:var(--ok);border-left-color:var(--ok);color:var(--ok)}
.banner.warn{border-color:#b8860b;border-left-color:#b8860b;color:#8a6508}
.banner .head{font-weight:600}
pre.report{margin:5px 0 0 0;font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:inherit}

/* ================================================================== 栅格系统
   现代后台式卡片网格：宽屏 3 列 / 中屏 2 列 / 窄屏 1 列，统一 14px 间距。
   卡片内部是「小标题 + 图/表」，不再使用 A/B/C 编号式纵向堆叠。 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(340px, 1fr));
  gap:14px;
  align-items:start;
  margin:0 0 14px 0;
}
.grid.one{grid-template-columns:minmax(0, 1fr)}
.grid.two{grid-template-columns:repeat(auto-fit, minmax(430px, 1fr))}
.grid.three{grid-template-columns:repeat(auto-fit, minmax(340px, 1fr))}
.grid.four{grid-template-columns:repeat(auto-fit, minmax(260px, 1fr))}
.grid.tight{gap:12px}
/* 让某张卡片跨满整行 / 跨两列（表格与宽图用） */
.span2{grid-column:span 2}
.span-all{grid-column:1 / -1}
@media (max-width:1040px){
  .grid{grid-template-columns:repeat(auto-fit, minmax(300px, 1fr))}
  .span2{grid-column:1 / -1}
}

/* -------------------------------------------------------------------- 卡片 */
.card{
  border:1px solid var(--hair);background:#fff;
  padding:13px 15px 15px 15px;margin:0;
  min-width:0;                     /* 允许在 grid 单元里收缩，避免 canvas 撑破 */
}
.grid > .card{height:100%}
.card > h2{
  font-size:12.5px;font-weight:500;margin:0 0 3px 0;letter-spacing:.01em;
}
.card > h2 .aux{font-weight:400;color:var(--muted);margin-left:7px;font-size:11.5px}
.card > .sub{font-size:11.5px;color:var(--muted);margin:0 0 11px 0;line-height:1.55}
.card > .sub b{color:var(--ink-soft);font-weight:600}
.card > .sub:last-child{margin-bottom:0}
.card.dense{padding:11px 13px 12px 13px}
.card-head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-head .grow{flex:1 1 180px;min-width:0}
.card-head > h2, .card-head h2{font-size:12.5px;font-weight:500;margin:0;letter-spacing:.01em}
.card-head .sub{margin:4px 0 0 0}
.section-title{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 9px 0;letter-spacing:.01em}

/* --------------------------------------------------- 指标条（紧凑 chip 行） */
.chips{
  display:flex;flex-wrap:wrap;gap:0 26px;align-items:flex-end;
  border:1px solid var(--hair);padding:10px 16px 12px 16px;margin:0 0 14px 0;
}
.chip{display:flex;flex-direction:column;gap:1px;padding:3px 0;min-width:0}
.chip .k{font-size:11px;color:var(--muted);letter-spacing:.01em}
.chip .v{
  font-size:19px;font-weight:600;line-height:1.2;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px;
}
.chip .u{font-size:11px;color:var(--muted);font-weight:400}
.chip.sm .v{font-size:15.5px}
/* 卡片内的紧凑指标块（2 列小网格） */
.mini-chips{
  display:grid;grid-template-columns:repeat(auto-fit, minmax(118px, 1fr));
  gap:8px 18px;margin:0 0 12px 0;
}
.mini-chips .chip{border:0;padding:0}
.mini-chips .chip .v{font-size:16px}

/* ------------------------------------------------------------------ 表格 */
table{border-collapse:collapse;width:100%;font-size:12px}
caption{caption-side:top;text-align:left;font-size:11.5px;color:var(--muted);padding:0 0 5px 0}
th{
  text-align:left;font-weight:600;font-size:11px;color:var(--ink);
  border-bottom:1px solid var(--axis);padding:5px 8px 5px 0;white-space:nowrap;
}
td{border-bottom:1px solid var(--hair-soft);padding:4px 8px 4px 0;vertical-align:top}
tbody tr:hover td{background:#fcfcfc}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{max-height:380px;overflow:auto}
.scroll.tall{max-height:520px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
.tag{
  display:inline-block;border:1px solid var(--hair);padding:0 5px;margin:0 4px 3px 0;
  font-size:11.5px;line-height:17px;white-space:nowrap;
}
.tag.g{border-color:var(--ink-soft);color:var(--ink-soft)}
.z-hi{color:var(--orange);font-weight:600}
.z-lo{color:var(--blue);font-weight:600}

/* 可点击下钻的行：hover 高亮 + 手型指针 */
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:#f2f6f8}
tr.rowlink:hover td:first-child{box-shadow:inset 2px 0 0 var(--ink)}
tr.rowlink.on td{background:#eef4f6}
tr.rowlink.on td:first-child{box-shadow:inset 2px 0 0 var(--v2)}
tr.rowlink:focus{outline:none}
tr.rowlink:focus td{background:#eef4f6}
td.drillcell::after{content:'⌄';color:var(--muted);margin-left:5px}
tr.rowlink:hover td.drillcell::after{color:var(--ink)}
canvas.hoverable{cursor:pointer}

/* 作用域与归属覆盖率 */
.scope-tag{
  display:inline-block;border:1px solid var(--ink);padding:1px 8px;font-size:11.5px;
  font-weight:600;letter-spacing:.01em;
}
.scope-tag.all{border-color:var(--hair);font-weight:400;color:var(--muted)}
.pair-title{font-size:19px;font-weight:600;letter-spacing:.01em;line-height:1.35}
.pair-title .arrow{color:var(--muted);font-weight:400;margin:0 6px}
.pair-title .sep{margin:0 6px;color:var(--hair)}
.pair-title .u{font-size:12px;font-weight:400;color:var(--muted);margin-left:10px}
.pair-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.pair-head .grow{flex:1 1 240px;min-width:0}

/* -------------------------------------------------------------- 表单控件 */
.toolbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:3px}
.field > label{font-size:11px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{
  font:inherit;font-size:12.5px;color:var(--ink);background:#fff;
  border:1px solid var(--hair);border-radius:0;padding:4px 6px;min-width:0;
}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--ink);
}
input.c1{width:52px;text-align:center;font-size:15px}
input.w120{width:120px}
input.w90{width:90px}
input.w160{width:160px}
textarea{width:320px;height:56px;resize:vertical}
select{min-width:230px}
button.btn{
  appearance:none;font:inherit;font-size:12.5px;cursor:pointer;
  background:#fff;color:var(--ink);border:1px solid var(--ink-soft);border-radius:0;
  padding:4px 12px;
}
button.btn:hover{background:#f4f4f4}
button.btn:active{background:#e9e9e9}
button.btn.sm{font-size:11.5px;padding:2px 8px;border-color:var(--hair)}
button.btn.sm:hover{border-color:var(--ink)}
button.btn.danger{border-color:var(--err);color:var(--err)}
button.btn.danger:hover{background:#fdf3f2}
button.btn:disabled{opacity:.45;cursor:default}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink-soft);font-weight:600}

/* 分段控件（模型切换 / 子标签） */
.seg{display:inline-flex;border:1px solid var(--hair)}
.seg button{
  appearance:none;font:inherit;font-size:11.5px;cursor:pointer;background:#fff;
  color:var(--muted);border:0;border-right:1px solid var(--hair);padding:3px 11px;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:#f7f7f7}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.seg.lg button{font-size:12.5px;padding:5px 16px}

/* 单选组 */
.radios{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.radios label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--ink);margin:0}

/* 色标图例 */
.cbar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--muted)}
.cbar .strip{
  height:9px;flex:1 1 auto;min-width:120px;max-width:420px;border:1px solid var(--hair);
  background:linear-gradient(to right,var(--v0),var(--v1),var(--v2),var(--v3),var(--v4));
}
.legend-inline{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 10px 0}
.legend-inline i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px}

/* 网格布局 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:900px){.split{grid-template-columns:1fr}}

/* 群体重条 */
.dist{display:flex;height:11px;border:1px solid var(--hair);margin-top:6px}
.dist span{display:block;min-width:0}
.dist-label{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.dist-label i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.src-pick{cursor:pointer}
.src-pick:hover{border-color:var(--ink);background:#f7f7f7}

/* 日志 */
pre.log{
  font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:11.5px;
  line-height:1.5;background:#fff;border:1px solid var(--hair-soft);
  padding:10px;margin:0;max-height:460px;overflow:auto;white-space:pre-wrap;word-break:break-all;
}
.hidden{display:none !important}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}
.chart-tip{position:fixed;left:0;top:0;pointer-events:none;z-index:9999;display:none;
  background:#fff;border:1px solid #333;padding:5px 8px;white-space:pre;
  font:12px/1.55 "Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;color:#111;
  box-shadow:0 2px 10px rgba(0,0,0,.14);max-width:320px}
canvas[data-tip]{cursor:crosshair}
/* 管理工作台：明确的层级、柔和卡片和紧凑移动端导航。图表色标保持原样。 */
body{background:#f5f7f7;color:#17252a}
header.topbar{align-items:center;padding:13px 24px 0;background:#fff;
  border-bottom:1px solid #dce5e4;box-shadow:0 2px 14px rgba(25,55,50,.05)}
.brand{flex-direction:column;align-items:flex-start;gap:0;padding-bottom:10px}
.brand b{font-size:18px;letter-spacing:-.02em}
.brand span{font-size:11px;letter-spacing:0}
nav.tabs{gap:4px}
nav.tabs button{padding:8px 12px 12px;border-radius:8px 8px 0 0;font-weight:500}
nav.tabs button:hover{background:#f0f6f4}
nav.tabs button.on{color:#166e62;border-bottom-color:#166e62;background:#edf7f4}
main{padding-top:24px}
.card,.chips{border:1px solid #e0e8e6;border-radius:12px;
  box-shadow:0 3px 14px rgba(24,57,52,.035)}
.card{padding:17px 19px 18px}
.card > h2,.card-head h2{font-size:14px;font-weight:650}
.chips{background:#fff}
button.btn{border-radius:7px}
input[type=text],input[type=number],select,textarea{border-radius:6px}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{
  border-color:#16806e;box-shadow:0 0 0 3px rgba(22,128,110,.12)}
.page-intro{margin:0 0 18px}
.page-intro h1{font-size:22px;line-height:1.2;margin:0 0 5px;font-weight:680;letter-spacing:-.025em}
.page-intro p{font-size:12.5px;color:var(--muted);margin:0}
.quality-score{font-size:32px;line-height:1.1;font-weight:700;color:#166e62}
.quality-score small{font-size:13px;color:var(--muted);font-weight:400}
.quality-form{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}
.quality-form .field{min-width:125px}
.quality-form .field.reason{flex:1 1 220px}
.quality-form .field.reason input{width:100%}
.quality-form .field input[type=number]{width:100px}
.quality-form .field input[type=text]{min-height:32px}
.quality-row{cursor:pointer}
.quality-row:hover td{background:#edf7f4}
.review-layout{display:grid;grid-template-columns:minmax(250px,32%) minmax(0,1fr);gap:14px;margin:0 0 14px}
.review-report{border:1px solid #cad7d4;background:#fff;padding:14px;min-width:0}
.review-report h2{text-align:center;font-size:19px;margin:0 0 14px;letter-spacing:.07em}
.report-pages{background:#ecefef;border:1px solid #dce5e4;padding:12px;
  display:flex;flex-direction:column;align-items:center;gap:12px;max-height:1100px;overflow:auto}
.report-page{display:block;width:100%;max-width:800px;height:auto;background:#fff;
  box-shadow:0 2px 9px rgba(0,0,0,.13)}
.report-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px;flex-wrap:wrap}
.report-editor{border-top:1px solid #dce5e4;margin-top:16px;padding:16px 6px 4px}
.report-editor h3{font-family:"SimHei","Microsoft YaHei",sans-serif;font-size:15px;margin:0 0 10px}
.review-section{border-top:1px solid #dce5e4;padding:11px 0}
.review-section h3{font-size:12px;margin:0 0 6px;color:#55706b}
.review-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 16px}
.review-raw{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9f8;padding:10px}
.review-signature{max-width:180px;max-height:80px;object-fit:contain;vertical-align:middle}
@media(max-width:820px){.review-layout{grid-template-columns:minmax(0,1fr)}
  .review-meta{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){
  header.topbar{padding:10px 12px 0;gap:4px}
  nav.tabs{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap}
  nav.tabs button{white-space:nowrap;font-size:12px;padding:8px 9px 10px}
  main{padding:16px 12px 40px}
  .grid,.grid.two,.grid.three{grid-template-columns:minmax(0,1fr)}
  .card{padding:14px}
  .foot{padding:0 12px 28px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><b>QBot 管理后台</b><span>本地 · 仅 127.0.0.1 · 无鉴权</span></div>
  <nav class="tabs" id="tabs">
    <button type="button" data-page="overview">数据大屏</button>
    <button type="button" data-page="bans">封禁管理</button>
    <button type="button" data-page="train">训练管理</button>
    <button type="button" data-page="dict">门禁管理</button>
    <button type="button" data-page="quality">用户质量分</button>
    <button type="button" data-page="system">系统</button>
  </nav>
</header>

<main id="view"></main>
<div class="foot" id="foot"></div>

<script>
'use strict';
(function () {
/* =========================================================================
 * 0. 全局状态
 * ====================================================================== */
var PAGES = ['overview', 'bans', 'train', 'dict', 'quality', 'system'];
var PAGE_TITLES = {
  overview: '数据大屏', bans: '封禁管理', train: '训练管理',
  dict: '门禁管理', quality: '用户质量分', system: '系统'
};
var MODEL_LABELS = { match: 'match', generate: 'generate', intelligence: 'intelligence' };
var MODEL_COLORS = { match: '#0072B2', generate: '#009E73', intelligence: '#CC79A7' };

var state = {
  page: 'overview',
  group: null,              // 当前选中群（封禁 / 训练页）
  auto: true,               // 自动刷新开关
  lastRefresh: 0,
  trainTab: 'match',        // 训练页子标签
  genUser: null,            // generate 作用域：null = 全部数据，否则为某个 QQ 号
  pair: null,               // 已展开的转移详情 key：{first, second}
  qualityUser: null,
  gateReport: null,
  gateStatus: 'pending'
};
var cache = {
  overview: null, bans: null, match: null, generate: null, generateUsers: null,
  pairDetail: null, explore: null, sources: null, dict: null, quality: null,
  qualityDetail: null, gateReports: null, gateReportDetail: null,
  gatePageInfo: null,
  system: null, log: null
};
var jobs = {};              // 按钮忙碌状态：key -> true
var GLOBAL_ERROR = '';

/* 默认关闭：自动刷新会重建页面 DOM，把用户填写的表单和已加载的图表刷走。 */
try { state.auto = localStorage.getItem('qbot.auto') === '1'; } catch (e) { /* 隐私模式：保持默认（关闭） */ }

/* =========================================================================
 * 1. 小工具：格式化 / 转义 / 数值安全
 * ====================================================================== */
var DASH = '—';

function isNum(v) { return typeof v === 'number' && isFinite(v); }

/** 安全取数值，非数字一律返回 fallback，避免 NaN/undefined 上屏。 */
function num(v, fallback) {
  if (isNum(v)) return v;
  if (typeof v === 'string' && v.trim() !== '' && isFinite(Number(v))) return Number(v);
  return fallback === undefined ? 0 : fallback;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/** 千分位整数：12345 → 12,345 */
function fmtInt(v) {
  if (!isNum(v)) return DASH;
  return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/** 定点小数并去掉无意义的尾随零：46.00 → 46、0.0158 → 0.0158 */
function fmtNum(v, digits) {

  var s = v.toFixed(d);

}

/** 紧凑计数：大数值用万/亿，图表刻度用 */
function fmtCompact(v) {
  if (!isNum(v)) return DASH;

  if (a >= 1e4) return fmtNum(v / 1e4, 2) + '万';
  return fmtInt(v);
}

/** 占比：0.0158 → 1.58% */
function fmtPct(v, digits) {
  if (!isNum(v)) return DASH;

function fmtBytes(v) {
  if (!isNum(v)) return DASH;
  if (v < 1024) return fmtInt(v) + ' B';
  if (v < 1024 * 1024) return fmtNum(v / 1024, 1) + ' KB';
  if (v < 1024 * 1024 * 1024) return fmtNum(v / 1048576, 1) + ' MB';

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function fmtTime(ts) {
  if (!isNum(ts) || ts <= 0) return DASH;

  if (isNaN(d.getTime())) return DASH;
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
    pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());

/** 秒 → 「x天x小时x分」，零段自动省略 */
function fmtDur(sec) {
  var s = num(sec, 0);

  if (h) out += h + ' 小时';
  if (m) out += m + ' 分';
  if (!out) out = (s % 60) + ' 秒';
  return out;
}

/** 秒 → 中文时长（词库表用：「12 小时」） */
function fmtDurLabel(sec) {
  if (!isNum(sec)) return DASH;
  if (sec >= 86400 && sec % 86400 === 0) return (sec / 86400) + ' 天';
  if (sec >= 3600 && sec % 3600 === 0) return (sec / 3600) + ' 小时';
  if (sec >= 60 && sec % 60 === 0) return (sec / 60) + ' 分钟';
  return sec + ' 秒';
}

function text(v) {
  if (v === null || v === undefined || v === '') return DASH;
  return String(v);
}

function groupLabel(group) {
  var g = findGroup(group);
  return g && g.label ? g.label : String(group);
}

  return m.length ? m : ['match', 'generate', 'intelligence'];

/* =========================================================================
 * 2. viridis 感知均匀色标 + Okabe-Ito 色盲友好配色
 * ====================================================================== */
var VIRIDIS = [
  [0.000, 68, 1, 84], [0.063, 72, 26, 108], [0.125, 71, 47, 125],
  [0.188, 65, 68, 135], [0.250, 59, 82, 139], [0.313, 49, 104, 142],
  [0.375, 38, 130, 142], [0.438, 31, 158, 137], [0.500, 53, 183, 121],
  [0.563, 109, 205, 89], [0.625, 180, 222, 44], [0.688, 253, 231, 37]
];
var OKABE_ITO = ['#0072B2', '#D55E00', '#009E73', '#CC79A7', '#E69F00', '#56B4E9', '#F0E442'];
var IN_COLOR = '#D55E00';     // 前驱 / 入边（暖）
var OUT_COLOR = '#0072B2';    // 后继 / 出边（冷）
var DARK_TEXT = '#0d0d0d';

/** 归一化位置 → viridis RGB 三元组 */
function viridisRGB(t) {
  var x = num(t, 0);
  if (!isFinite(x)) x = 0;
  if (x < 0) x = 0;
  if (x > 1) x = 1;
  for (var i = 1; i < VIRIDIS.length; i++) {
    if (x <= VIRIDIS[i][0] || i === VIRIDIS.length - 1) {
      var a = VIRIDIS[i - 1], b = VIRIDIS[i];
      var span = b[0] - a[0];
      var f = span > 1e-9 ? (x - a[0]) / span : 0;
      if (f < 0) f = 0; if (f > 1) f = 1;
      return [
        Math.round(a[1] + (b[1] - a[1]) * f),
        Math.round(a[2] + (b[2] - a[2]) * f),
        Math.round(a[3] + (b[3] - a[3]) * f)
      ];
    }
  }
  return [68, 1, 84];
}
function viridisCss(t, alpha) {
  var c = viridisRGB(t);
  if (alpha !== undefined && alpha < 1) return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + alpha + ')';
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}
/** 任意数值 → viridis 颜色（线性拉伸到 min..max） */
function vmap(v, min, max, alpha) {
  var lo = num(min, 0), hi = num(max, 1), x = num(v, 0);
  var t = (hi - lo) < 1e-12 ? 0.5 : (x - lo) / (hi - lo);
  return viridisCss(t, alpha);
}
/** 相对亮度，用于决定单元格文字取黑还是白 */
function luminance(rgb) {
  return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
}
function textOn(rgb) { return luminance(rgb) > 0.55 ? DARK_TEXT : '#ffffff'; }
function hexToRgb(hex) {
  var h = String(hex).replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixRgb(a, b, f) {
  return [
    Math.round(a[0] + (b[0] - a[0]) * f),
    Math.round(a[1] + (b[1] - a[1]) * f),
    Math.round(a[2] + (b[2] - a[2]) * f)
  ];
}
function rgbCss(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

/* =========================================================================
 * 3. Canvas 绘图基建（高清屏 / 坐标轴 / 文本）
 * ====================================================================== */
var FONT = '"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif';
var AXIS = '#333';
var GRID = '#eee';
var HAIR = '#d9d9d9';
var MUTED = '#666';
var INK = '#111';

function axisFont(px) { return px + 'px ' + FONT; }
function tickFont(px) { return (px || 11) + 'px ' + FONT; }
function labelFont(px) { return (px || 11.5) + 'px ' + FONT; }
function boldFont(px) { return '600 ' + (px || 12) + 'px ' + FONT; }

/** 按 CSS 尺寸与 devicePixelRatio 重置画布，返回已缩放的 2D 上下文。 */
function fit(canvas, wFallback, hFallback) {
  if (!canvas) return null;
  var rect = canvas.getBoundingClientRect();
  var w = Math.max(1, Math.round(rect.width || wFallback || 600));
  var h = Math.max(1, Math.round(rect.height || hFallback || 240));
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  var ctx = canvas.getContext('2d');
  if (!ctx) return null;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  return { ctx: ctx, w: w, h: h, dpr: dpr };
}

/** 空数据提示：不画坐标轴 */
function emptyCanvas(canvas, message) {
  var c = fit(canvas);
  if (!c) return;
  c.ctx.font = labelFont(12);
  c.ctx.fillStyle = MUTED;
  c.ctx.textAlign = 'center';
  c.ctx.fillText(message || '暂无数据', c.w / 2, c.h / 2);
  c.ctx.textAlign = 'left';
}

function measure(ctx, s, font) {
  if (font) ctx.font = font;
  return ctx.measureText(String(s)).width;
}

/** 截断过长文本并加省略号 */
function ellipsize(ctx, s, maxWidth, font) {
  var str = String(s === null || s === undefined ? '' : s);
  if (font) ctx.font = font;
  if (maxWidth <= 0) return '';
  if (ctx.measureText(str).width <= maxWidth) return str;
  var out = str;
  while (out.length > 1 && ctx.measureText(out + '…').width > maxWidth) out = out.slice(0, -1);
  return out + '…';
}

/** 横排：保持宽度，缩字号直到放下 */
function fitTextH(ctx, s, maxWidth, basePx, fontBuilder, minPx) {
  var px = basePx, make = fontBuilder || labelFont, min = minPx || 9;
  while (px > min) {
    if (measure(ctx, s, make(px)) <= maxWidth) return px;
    px -= 0.5;
  }
  return min;
}

/** 「漂亮刻度」：返回 {min,max,step,ticks[]} */
function niceScale(lo, hi, target) {
  var t = target || 5;
  if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
  if (hi <= lo) hi = lo + 1;
  var raw = (hi - lo) / t;
  var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
  var norm = raw / mag;
  var step;
  if (norm <= 1) step = 1; else if (norm <= 2) step = 2; else if (norm <= 2.5) step = 2.5;
  else if (norm <= 5) step = 5; else step = 10;
  step *= mag;
  var min = Math.floor(lo / step) * step;
  var max = Math.ceil(hi / step) * step;
  if (max === min) max = min + step;
  var ticks = [];
  for (var v = min; v <= max + step * 1e-6 && ticks.length < 40; v += step) {
    ticks.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  }
  return { min: min, max: max, step: step, ticks: ticks };
}

function tickText(v) {
  if (!isNum(v)) return '';
  if (Math.abs(v) >= 1e6 || (v !== 0 && Math.abs(v) < 0.001)) return fmtNum(v, 2);
  var a = Math.abs(v);
  var digits = a === 0 ? 0 : (a % 1 === 0 ? 0 : (a < 0.05 ? 3 : (a < 1 ? 2 : 1)));
  return fmtNum(v, digits);
}

function withAlpha(ctx, alpha, fn) {
  var old = ctx.globalAlpha;
  ctx.globalAlpha = old * alpha;
  fn();
  ctx.globalAlpha = old;
}

/* -- 坐标轴：去掉上/右边框，刻度线统一朝外 ------------------------------- */
function drawAxis(ctx, o) {
  var L = o.left, T = o.top, R = o.right, B = o.bottom;
  var labels = o.labels !== false;
  var grid = o.grid === true;
  var gridX = grid && o.gridX !== false;
  var gridY = grid && o.gridY !== false;
  var fY = tickFont(o.fontY || o.font || 11);
  var fX = tickFont(o.fontX || o.font || 11);

  ctx.save();
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(L, T);
  ctx.lineTo(L, B);
  ctx.lineTo(R, B);
  ctx.stroke();

  // 网格（回归图常见的极浅虚线，放在数据下面调用）
  if (grid) {
    ctx.save();
    ctx.strokeStyle = GRID;
    ctx.setLineDash([2, 3]);
    ctx.beginPath();
    if (gridY) for (var i = 0; i < o.yticks.length; i++) {
      var gy = Math.round(o.ys(o.yticks[i])) + 0.5;
      ctx.moveTo(L, gy); ctx.lineTo(R, gy);
    }
    if (gridX && o.xs) for (var j = 0; j < o.xticks.length; j++) {
      var gx = Math.round(o.xs(o.xticks[j])) + 0.5;
      ctx.moveTo(gx, T); ctx.lineTo(gx, B);
    }
    ctx.stroke();
    ctx.restore();
  }

  // 刻度线（朝外）+ 刻度值
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.font = fY;
  ctx.fillStyle = INK;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var a = 0; labels && a < o.yticks.length; a++) {
    var y = Math.round(o.ys(o.yticks[a])) + 0.5;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(L - 4, y); ctx.stroke();
    ctx.fillText(ellipsize(ctx, o.ytickLabel ? o.ytickLabel(o.yticks[a]) : tickText(o.yticks[a]),
      L - 7, fY), L - 7, y);
  }
  ctx.font = fX;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  for (var b = 0; labels && o.xs && b < o.xticks.length; b++) {
    var x = Math.round(o.xs(o.xticks[b])) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, B); ctx.lineTo(x, B + 4); ctx.stroke();
    ctx.fillText(ellipsize(ctx, o.xtickLabel ? o.xtickLabel(o.xticks[b]) : tickText(o.xticks[b]),
      (R - L) / Math.max(1, o.xticks.length) - 4, fX), x, B + 7);
  }

  // 轴标题（带单位）
  ctx.font = labelFont(11.5);
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  if (o.xlabel) ctx.fillText(o.xlabel, (L + R) / 2, o.xLabelOffset || (labels ? B + 30 : B + 16));
  if (o.ylabel) {
    ctx.save();
    ctx.translate(13, (T + B) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(o.ylabel, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

function drawPanelLabel(ctx, letter, x, y, size) {
  ctx.save();
  ctx.font = '700 ' + (size || 13) + 'px ' + FONT;
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(letter, x === undefined ? 2 : x, y === undefined ? 0 : y);
  ctx.restore();

/** 画布内联色标条 */
function drawColorbar(ctx, x, y, w, h, loLabel, hiLabel, title) {
  var g = ctx.createLinearGradient(x, y, x + w, y);
  for (var i = 0; i <= 10; i++) g.addColorStop(i / 10, viridisCss(i / 10));
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = HAIR;
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.font = tickFont(10);
  ctx.fillStyle = MUTED;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  if (title) ctx.fillText(title, x, y - 13);
  ctx.fillText(loLabel, x, y + h + 3);
  ctx.textAlign = 'right';
  ctx.fillText(hiLabel, x + w, y + h + 3);
  ctx.restore();
}

function drawNoData(ctx, x, y, w, h, message) {
  ctx.save();
  ctx.font = labelFont(12);
  ctx.fillStyle = MUTED;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(message || '暂无数据', x + w / 2, y + h / 2);
  ctx.restore();
}

/* =========================================================================
 * 4. 图形：分组条形图 / 横条图 / 直方图 / 热力图 / 网络图
 * ====================================================================== */

/** 简单纵向条形图，可选按高度着色（value 本身作色） */
function drawBarChart(canvas, opt) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var rows = opt.rows || [];
  var L = 58, R = c.w - 14, T = opt.panel ? 22 : 12, B = c.h - 40;
  if (R - L < 40 || B - T < 30) return;
  if (!rows.length) { drawNoData(ctx, L, T, R - L, B - T); return; }

  var maxV = 0;
  rows.forEach(function (r) { maxV = Math.max(maxV, num(r.value, 0)); });
  var sc = niceScale(0, Math.max(maxV, 1), 5);
  var ys = function (v) { return B - (num(v, 0) - sc.min) / (sc.max - sc.min) * (B - T); };

  if (opt.panel) drawPanelLabel(ctx, opt.panel, 2, 2);

  var slot = (R - L) / rows.length;
  var bw = Math.min(64, slot * 0.62);
  var geo = { left: L, right: R, top: T, bottom: B, ys: ys, yticks: sc.ticks };

  // 网格先画
  ctx.save();
  ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath();
  sc.ticks.forEach(function (t) {
    var y = Math.round(ys(t)) + 0.5;
    ctx.moveTo(L, y); ctx.lineTo(R, y);
  });
  ctx.stroke();
  ctx.restore();

  rows.forEach(function (r, i) {
    var v = num(r.value, 0);
    var x = L + slot * i + (slot - bw) / 2;
    var y = ys(v);
    var h = Math.max(v > 0 ? 0.75 : 0, B - y);
    ctx.fillStyle = opt.barColor ? opt.barColor(r, i) : '#3b528b';
    ctx.fillRect(x, y, bw, h);
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(bw) - 1, Math.max(h > 0.75 ? Math.round(h) : 1, 1));
    // 条顶直接标数值
    ctx.font = boldFont(11.5);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(ellipsize(ctx, fmtInt(v), bw + 22, boldFont(11.5)), x + bw / 2, y - 3);
    // 类别标签
    ctx.font = tickFont(11);
    ctx.fillStyle = INK;
    ctx.textBaseline = 'top';
    ctx.fillText(ellipsize(ctx, text(r.name), slot - 4, tickFont(11)), L + slot * i + slot / 2, B + 8);
  });

  drawAxis(ctx, {
    left: L, right: R, top: T, bottom: B, ys: ys, yticks: sc.ticks,
    grid: false, labels: true, ylabel: opt.yLabel, xLabelOffset: B + 27,
    ytickLabel: opt.yTick
  });
  // 仅保留左轴与刻度，底部轴线由 drawAxis 负责
  return geo;
}

/** 分组条形图：每个群一组，每组多个系列（各自按组内最大值归一化） */
function drawGroupedBar(canvas, opts) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var groups = opts.groups || [];
  var series = opts.series || [];
  var hasData = groups.some(function (g) {
    return series.some(function (s) { return num(g.values[s.key], 0) > 0; });
  });
  var L = 58, R = c.w - 14, T = opts.panel ? 34 : 26, B = c.h - 44;
  if (!groups.length || !series.length || !hasData) {
    drawNoData(ctx, L, T, R - L, B - T);
    return;
  }
  var sc = niceScale(0, 100, 5);
  var ys = function (v) { return B - (num(v, 0) / sc.max) * (B - T); };

  if (opts.panel) drawPanelLabel(ctx, opts.panel, 2, 2);

  ctx.save();
  ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath();
  sc.ticks.forEach(function (t) {
    var y = Math.round(ys(t)) + 0.5;
    ctx.moveTo(L, y); ctx.lineTo(R, y);
  });
  ctx.stroke();
  ctx.restore();

  var slot = (R - L) / groups.length;
  var inner = slot * 0.72;
  var bw = Math.max(4, Math.min(30, inner / series.length - 3));
  var groupW = bw * series.length + 3 * (series.length - 1);

  groups.forEach(function (g, gi) {
    var vals = series.map(function (s) { return num(g.values[s.key], 0); });
    var groupMax = Math.max.apply(null, vals.concat([1]));
    var x0 = L + slot * gi + (slot - groupW) / 2;
    series.forEach(function (s, si) {
      var v = num(g.values[s.key], 0);
      var rel = v / groupMax * 100;
      var x = x0 + si * (bw + 3);
      var y = ys(rel);
      var h = Math.max(v > 0 ? 0.8 : 0, B - y);
      ctx.fillStyle = s.color;
      ctx.fillRect(x, y, bw, h);
      ctx.strokeStyle = AXIS; ctx.lineWidth = 1;
      if (v > 0) ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(bw) - 1, Math.round(h));
    });
    ctx.font = tickFont(11);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(ellipsize(ctx, text(g.name), slot - 4, tickFont(11)), L + slot * gi + slot / 2, B + 8);
  });

  drawAxis(ctx, {
    left: L, right: R, top: T, bottom: B, ys: ys, yticks: sc.ticks,
    grid: false, labels: true, ylabel: opts.yLabel, xLabelOffset: B + 28,
    ytickLabel: function (v) { return tickText(v); }
  });

  // 图例（简洁：色块 + 文字，右侧越界即截断）
  var lx = L, ly = 8;
  ctx.save();
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  series.forEach(function (s) {
    var gap = 18;
    var avail = R - lx - gap;
    if (avail < 34) return;
    var px = fitTextH(ctx, s.name, avail - 15, 11, tickFont, 9);
    ctx.font = tickFont(px);
    var tw = Math.min(measure(ctx, s.name, tickFont(px)), avail - 15);
    ctx.fillStyle = s.color;
    ctx.fillRect(lx, ly - 5, 10, 10);
    ctx.strokeStyle = AXIS;
    ctx.lineWidth = 1;
    ctx.strokeRect(lx + 0.5, ly - 4.5, 9, 9);
    ctx.fillStyle = INK;
    ctx.fillText(ellipsize(ctx, s.name, tw, tickFont(px)), lx + 15, ly);
    lx += 15 + tw + gap;
  });
  ctx.restore();
}

/** 横条图：条尾标数值 */
function drawBarChartH(canvas, opt) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var rows = opt.rows || [];
  if (!rows.length) {
    drawNoData(ctx, 8, 8, c.w - 16, c.h - 16);
    return;
  }
  if (opt.panel) drawPanelLabel(ctx, opt.panel, 2, 2);

  var padL = opt.labelWidth || 150;
  var padR = opt.valueWidth || 64;
  var top = (opt.panel ? 24 : 8) + (opt.title ? 16 : 0);
  var bottom = c.h - 26;
  var L = padL, R = c.w - padR;
  if (R - L < 30) { drawNoData(ctx, 8, 8, c.w - 16, c.h - 16); return; }
  var maxV = 0;
  rows.forEach(function (r) { maxV = Math.max(maxV, num(r.value, 0)); });
  maxV = Math.max(maxV, 1);
  var rowH = Math.max(9, (bottom - top) / rows.length);
  var barH = Math.min(18, rowH * 0.7);

  if (opt.title) {
    ctx.save();
    ctx.font = labelFont(11.5);
    ctx.fillStyle = INK;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(opt.title, 2, (opt.panel ? 20 : 2));
    ctx.restore();
  }

  rows.forEach(function (r, i) {
    var y = top + i * rowH + (rowH - barH) / 2;
    var w = num(r.value, 0) / maxV * (R - L);
    ctx.fillStyle = opt.barColor ? opt.barColor(r, i) : '#3b528b';
    ctx.fillRect(L, y, Math.max(w, num(r.value, 0) > 0 ? 0.8 : 0), barH);
    // 行标签
    ctx.font = (opt.rowFont || tickFont)(opt.rowFontPx || 11.5);
    ctx.fillStyle = INK;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText(ellipsize(ctx, text(r.name), padL - 10, (opt.rowFont || tickFont)(opt.rowFontPx || 11.5)),
      L - 7, y + barH / 2);
    // 条尾数值
    ctx.textAlign = 'left';
    ctx.font = (opt.valFont || tickFont)(opt.valFontPx || 11);
    ctx.fillStyle = INK;
    ctx.fillText(ellipsize(ctx, text(r.label === undefined ? fmtInt(r.value) : r.label),
      padR - 4, (opt.valFont || tickFont)(opt.valFontPx || 11)), L + Math.max(w, num(r.value, 0) > 0 ? 0.8 : 0) + 6, y + barH / 2);
  });

  // 底部细轴线
  ctx.save();
  ctx.strokeStyle = AXIS; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L, Math.round(bottom) + 0.5);
  ctx.lineTo(R + 6, Math.round(bottom) + 0.5);
  ctx.stroke();
  ctx.font = tickFont(10.5);
  ctx.fillStyle = MUTED;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(opt.xLabel || '', L, bottom + 6);
  ctx.textAlign = 'right';
  ctx.fillText(opt.xMaxLabel === undefined ? fmtInt(maxV) : opt.xMaxLabel, R, bottom + 6);
  ctx.restore();
  var geo = { top: top, bottom: bottom, rowH: rowH, left: L, right: R, maxV: maxV };
  if (opt.hover) wireHBarHover(canvas, rows, geo, opt);
  return geo;
}

/**
 * 横条 hover 高亮：在原始画面上叠一层浅底并重画当前条（提到满不透明度），
 * 同时按同样的几何约定补画行标签与条尾数值。
 */
function paintHBarHover(canvas, rows, geo, index, opt) {
  if (index < 0 || index >= rows.length) return;
  var rect = canvas.getBoundingClientRect();
  var w = Math.round(rect.width);
  if (!w) return;
  var ctx = canvas.getContext('2d');
  var rowH = geo.rowH;
  var barH = Math.min(18, rowH * 0.7);
  var barY = geo.top + index * rowH + (rowH - barH) / 2;
  var r = rows[index];
  var bw = num(r.value, 0) / Math.max(1, num(geo.maxV, 1)) * (geo.right - geo.left);
  var rowFont = (opt.rowFont || tickFont)(opt.rowFontPx || 11.5);
  var valFont = (opt.valFont || tickFont)(opt.valFontPx || 11);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.045)';
  ctx.fillRect(0, geo.top + index * rowH, w, rowH);
  ctx.fillStyle = opt.barColor ? opt.barColor(r, index) : '#3b528b';
  ctx.fillRect(geo.left, barY, Math.max(bw, num(r.value, 0) > 0 ? 0.8 : 0), barH);
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1;
  if (num(r.value, 0) > 0) {
    ctx.strokeRect(Math.round(geo.left) + 0.5, Math.round(barY) + 0.5,
      Math.round(Math.max(bw, 0.8)) - 1, Math.round(barH));
  }
  ctx.fillStyle = INK;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(ellipsize(ctx, text(r.name), (opt.labelWidth || 150) - 10, rowFont), geo.left - 7, barY + barH / 2);
  ctx.textAlign = 'left';
  ctx.font = valFont;
  ctx.fillStyle = INK;
  ctx.fillText(ellipsize(ctx, text(r.label === undefined ? fmtInt(r.value) : r.label),
    (opt.valueWidth || 64) - 4, valFont), geo.left + Math.max(bw, num(r.value, 0) > 0 ? 0.8 : 0) + 6, barY + barH / 2);
  ctx.restore();
}

function wireHBarHover(canvas, rows, geo, opt) {
  if (canvas.dataset.hbarHover === '1') return;
  canvas.dataset.hbarHover = '1';
  var last = -1;
  function redraw() {
    if (typeof canvas.__hbarDraw === 'function') canvas.__hbarDraw();
  }
  canvas.addEventListener('mousemove', function (ev) {
    var rect = canvas.getBoundingClientRect();
    var idx = Math.floor((ev.clientY - rect.top - geo.top) / geo.rowH);
    if (idx < 0 || idx >= rows.length) idx = -1;
    if (idx === last) return;
    last = idx;
    redraw();
    if (idx >= 0) paintHBarHover(canvas, rows, geo, idx, opt);
  });
  canvas.addEventListener('mouseleave', function () {
    if (last === -1) return;
    last = -1;
    redraw();
  });
}

/** 直方图：x 轴为 log10(权重)，条高为转移数量，条色按高度取 viridis */
function drawHistogram(canvas, hist, panel) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var bins = (hist && hist.bins) || [];
  var counts = (hist && hist.counts) || [];
  var n = Math.min(bins.length, counts.length);
  var sum = 0;
  for (var i = 0; i < n; i++) sum += num(counts[i], 0);
  if (n < 2 || sum <= 0) {
    drawNoData(ctx, 0, 0, c.w, c.h, '暂无权重数据');
    return;
  }
  var L = 60, R = c.w - 16, T = panel ? 26 : 14, B = c.h - 52;
  var maxC = 0;
  for (var j = 0; j < n; j++) maxC = Math.max(maxC, num(counts[j], 0));
  var sc = niceScale(0, Math.max(maxC, 1), 4);
  var ys = function (v) { return B - num(v, 0) / sc.max * (B - T); };
  var lo = num(bins[0], 0), hi = num(bins[n - 1], lo + 1);
  var span = (hi - lo) || 1;
  var xs = function (v) { return L + (num(v, 0) - lo) / span * (R - L); };

  if (panel) drawPanelLabel(ctx, panel, 2, 2);

  ctx.save();
  ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath();
  sc.ticks.forEach(function (t) {
    var y = Math.round(ys(t)) + 0.5;
    ctx.moveTo(L, y); ctx.lineTo(R, y);
  });
  ctx.stroke();
  ctx.restore();

  var slot = (R - L) / n;
  var bw = slot * 0.88;
  for (var k = 0; k < n; k++) {
    var v = num(counts[k], 0);
    if (v <= 0) continue;
    var x = L + slot * k + (slot - bw) / 2;
    var y = ys(v);
    ctx.fillStyle = vmap(v, 0, maxC);
    ctx.fillRect(x, y, bw, B - y);
    ctx.strokeStyle = AXIS; ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(bw) - 1, Math.max(Math.round(B - y), 1));
  }

  // 稀疏 x 刻度，避免重叠
  var xticks = [];
  var stepIdx = Math.max(1, Math.ceil(n / 7));
  for (var m = 0; m < n; m += stepIdx) xticks.push(num(bins[m], 0));

  drawAxis(ctx, {
    left: L, right: R, top: T, bottom: B, xs: xs, ys: ys,
    xticks: xticks, yticks: sc.ticks, grid: false,
    xlabel: 'log₁₀(权重)', ylabel: '转移数量',
    xtickLabel: function (v) { return fmtNum(v, 1); }
  });
  drawColorbar(ctx, R - 158, B + 20, 150, 7, '数量 ' + fmtInt(0), fmtInt(maxC), '');

  // 面板标签与色标说明（避免与轴标题挤在一起）
  ctx.save();
  ctx.font = boldFont(13);
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('C', 2, 0);
  ctx.font = tickFont(10.5);
  ctx.fillStyle = MUTED;
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('柱色 = 柱高（viridis 连续映射）', L, B + 38);
  ctx.restore();
}

/* ---- 图表悬停提示 --------------------------------------------------------
   绘图函数把命中点按 CSS 像素坐标登记到 canvas.__hits，鼠标移动时取最近点。
   没有它，散点图/折线图只能看到形状而不知道每个点是什么，基本等于废图。 */
var TIP = null;
function tipEl() {
  if (!TIP) {
    TIP = document.createElement('div');
    TIP.className = 'chart-tip';
    document.body.appendChild(TIP);
  }
  return TIP;
}
function setHits(canvas, hits) {
  if (canvas) canvas.__hits = hits || [];
}
function bindTip(canvas) {
  if (!canvas || canvas.__tipBound) return;
  canvas.__tipBound = true;
  canvas.setAttribute('data-tip', '1');
  canvas.addEventListener('mousemove', function (ev) {
    var hits = canvas.__hits;
    var tip = tipEl();
    if (!hits || !hits.length) { tip.style.display = 'none'; return; }
    var rect = canvas.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var best = null, bestD = Infinity;
    for (var i = 0; i < hits.length; i++) {
      var dx = hits[i].x - mx, dy = hits[i].y - my;
      var d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = hits[i]; }
    }
    var reach = best && best.r ? best.r + 8 : 16;
    if (!best || bestD > reach * reach) { tip.style.display = 'none'; return; }
    tip.textContent = best.tip;
    tip.style.display = 'block';
    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(window.innerWidth - w - 8, ev.clientX + 14)) + 'px';
    tip.style.top = Math.max(6, ev.clientY - h - 12) + 'px';
  });
  canvas.addEventListener('mouseleave', function () { tipEl().style.display = 'none'; });
}

/**
 * 通用折线/散点图，支持线性或对数轴与参考线。
 * opt = {points:[{x,y,tip}], xlog, ylog, xlabel, ylabel, panel, empty, mode,
 *        refY:[{y,label,color}], guide:[{x,y}], ymin, ymax, footnote, ...}
 */
function drawSeriesChart(canvas, opt) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var xlog = opt.xlog === true, ylog = opt.ylog === true;
  var pts = (opt.points || []).filter(function (p) {
    return p && isFinite(p.x) && isFinite(p.y) && (!xlog || p.x > 0) && (!ylog || p.y > 0);
  });
  if (pts.length < 2) {
    drawNoData(ctx, 0, 0, c.w, c.h, opt.empty || '数据点不足，无法绘图');
    return;
  }
  if (opt.panel) drawPanelLabel(ctx, opt.panel, 2, 2);

  var L = opt.left || 66, R = c.w - 18, T = 26, B = c.h - 52;
  var tx = function (v) { return xlog ? Math.log10(v) : v; };
  var ty = function (v) { return ylog ? Math.log10(v) : v; };
  var inv = function (t, log) { return log ? Math.pow(10, t) : t; };

  var xsAll = pts.map(function (p) { return tx(p.x); });
  var ysAll = pts.map(function (p) { return ty(p.y); });
  (opt.refY || []).forEach(function (r) {
    if (isFinite(r.y) && (!ylog || r.y > 0)) ysAll.push(ty(r.y));
  });
  var x0 = Math.min.apply(null, xsAll), x1 = Math.max.apply(null, xsAll);
  var y0 = Math.min.apply(null, ysAll), y1 = Math.max.apply(null, ysAll);
  if (opt.ymin !== undefined && opt.ymin !== null) y0 = Math.min(y0, ty(opt.ymin));
  if (opt.ymax !== undefined && opt.ymax !== null) y1 = Math.max(y1, ty(opt.ymax));
  if (x1 - x0 < 1e-9) { x0 -= 0.5; x1 += 0.5; }
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  if (!ylog) { var padY = (y1 - y0) * 0.08; y1 += padY; y0 -= padY; }
  if (!xlog) { var padX = (x1 - x0) * 0.04; x0 -= padX; x1 += padX; }

  var xs = function (v) { return L + (tx(v) - x0) / (x1 - x0) * (R - L); };
  var ys = function (v) { return B - (ty(v) - y0) / (y1 - y0) * (B - T); };

  ctx.save();
  ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath();
  for (var g = 0; g <= 4; g++) {
    var gy = Math.round(B - (B - T) * g / 4) + 0.5;
    ctx.moveTo(L, gy); ctx.lineTo(R, gy);
  }
  ctx.stroke();
  ctx.restore();

  (opt.refY || []).forEach(function (r) {
    if (!isFinite(r.y) || (ylog && r.y <= 0)) return;
    var y = Math.round(ys(r.y)) + 0.5;
    ctx.save();
    ctx.strokeStyle = r.color || '#b2182b';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke();
    ctx.restore();
    if (r.label) {
      ctx.save();
      ctx.font = tickFont(10);
      ctx.fillStyle = r.color || '#b2182b';
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(ellipsize(ctx, r.label, R - L - 8, tickFont(10)), L + 4, y - 2);
      ctx.restore();
    }
  });

  if (opt.guide && opt.guide.length >= 2) {
    ctx.save();
    ctx.strokeStyle = MUTED; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    ctx.beginPath();
    opt.guide.forEach(function (p, i) {
      if (i) ctx.lineTo(xs(p.x), ys(p.y)); else ctx.moveTo(xs(p.x), ys(p.y));
    });
    ctx.stroke();
    ctx.restore();
  }

  if (opt.mode !== 'points') {
    ctx.save();
    ctx.strokeStyle = opt.lineColor || '#21918c';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    pts.forEach(function (p, i) {
      if (i) ctx.lineTo(xs(p.x), ys(p.y)); else ctx.moveTo(xs(p.x), ys(p.y));
    });
    ctx.stroke();
    ctx.restore();
  }
  ctx.save();
  ctx.fillStyle = opt.pointColor || '#440154';
  var radius = pts.length > 60 ? 1.1 : 2.4;
  var hits = [];
  pts.forEach(function (p) {
    var px = xs(p.x), py = ys(p.y);
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fill();
    hits.push({ x: px, y: py, r: radius + 3,
                tip: p.tip || (p.label ? (p.label + '\n' + p.x + ', ' + p.y) : (p.x + ', ' + p.y)) });
  });
  ctx.restore();
  setHits(canvas, hits);
  bindTip(canvas);

  var xTicks = [], yTicks = [];
  for (var i = 0; i <= 4; i++) {
    xTicks.push(inv(x0 + (x1 - x0) * i / 4, xlog));
    yTicks.push(inv(y0 + (y1 - y0) * i / 4, ylog));
  }
  var decimals = function (value) { return value === undefined ? 0 : value; };
  drawAxis(ctx, {
    left: L, right: R, top: T, bottom: B, xs: xs, ys: ys,
    xticks: xTicks, yticks: yTicks, grid: false,
    xlabel: opt.xlabel || '', ylabel: opt.ylabel || '',
    xtickLabel: function (v) { return xlog ? tickText(v) : fmtNum(v, decimals(opt.xdecimals)); },
    ytickLabel: function (v) { return ylog ? tickText(v) : fmtNum(v, decimals(opt.ydecimals)); }
  });
  if (opt.footnote) {
    ctx.save();
    ctx.font = tickFont(10.5);
    ctx.fillStyle = MUTED;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(ellipsize(ctx, opt.footnote, R - L, tickFont(10.5)), L, B + 38);
    ctx.restore();
  }
}

/** 排名–权重（rank–abundance / Zipf）：log-log 下越接近直线越像幂律分布 */
function drawRankAbundance(canvas, rows, panel) {
  var sorted = (rows || []).slice().sort(function (a, b) { return num(b.w, 0) - num(a.w, 0); });
  var c = fit(canvas);
  if (sorted.length < 2) {
    if (c) drawNoData(c.ctx, 0, 0, c.w, c.h, '后继种类少于 2 个，无法判断分布形状');
    setHits(canvas, []);
    return;
  }
  var points = sorted.map(function (r, i) {
    return {
      x: i + 1, y: Math.max(1, num(r.w, 0)),
      tip: '后继「' + text(r.second) + '」  排名 ' + fmtInt(i + 1) + ' / ' + fmtInt(sorted.length) +
        '\n权重 ' + fmtInt(r.w) +
        '\n占该字出边 ' + fmtPct(num(r.share, 0), 2) +
        '\n全群边际占比 ' + fmtPct(num(r.marginal_share, 0), 2) +
        '\nlift ' + fmtNum(r.lift, 2)
    };
  });
  drawSeriesChart(canvas, {
    points: points, xlog: true, ylog: true, mode: 'points', panel: panel,
    xlabel: '后继排名（log）', ylabel: '权重（log）',
    pointColor: '#440154',
    guide: [points[0], points[points.length - 1]],
    footnote: '虚线 = 端点连线（幂律参考）'
  });
}

/** lift：后继相对全群基线的富集倍数（1.0 = 与整体频率相同） */
function drawLiftChart(canvas, rows, panel) {
  var sorted = (rows || []).filter(function (r) { return num(r.lift, 0) > 0; })
    .slice().sort(function (a, b) { return num(b.lift, 0) - num(a.lift, 0); });
  var c = fit(canvas);
  if (sorted.length < 2) {
    if (c) drawNoData(c.ctx, 0, 0, c.w, c.h, '后继种类少于 2 个，无法计算富集倍数');
    setHits(canvas, []);
    return;
  }
  var points = sorted.map(function (r, i) {
    return {
      x: i + 1, y: num(r.lift, 0),
      tip: '后继「' + text(r.second) + '」  lift ' + fmtNum(r.lift, 2) +
        '\n（第 ' + fmtInt(i + 1) + ' / ' + fmtInt(sorted.length) + ' 名）' +
        '\n该字内占比 ' + fmtPct(num(r.share, 0), 2) +
        '\n全群边际占比 ' + fmtPct(num(r.marginal_share, 0), 2) +
        '\n权重 ' + fmtInt(r.w)
    };
  });
  drawSeriesChart(canvas, {
    points: points, panel: panel, mode: 'points',
    xlabel: '后继排名（按 lift 降序）', ylabel: 'lift', ydecimals: 1,
    pointColor: '#5ec962',
    refY: [{ y: 1, label: 'lift = 1（与整体频率持平）', color: '#777777' }],
    footnote: '明显大于 1 = 该字特有搭配；≈1 = 全群高频字'
  });
}

/** 热力图：单元格 viridis 着色 + 对比色数值 */
function drawHeatmap(canvas, hm) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var rows = (hm && hm.rows) || [];
  var cols = (hm && hm.cols) || [];
  var values = (hm && hm.values) || [];
  if (!rows.length || !cols.length) {
    drawNoData(ctx, 0, 0, c.w, c.h, '暂无前驱/后继数据');
    return;
  }
  var padL = 40, padT = 26, padR = 8, padB = 76;
  var gridW = c.w - padL - padR;
  var gridH = c.h - padT - padB;
  var cellW = gridW / cols.length;
  var cellH = gridH / rows.length;
  var maxV = 1;
  for (var r = 0; r < rows.length; r++) {
    var line = values[r] || [];
    for (var q = 0; q < cols.length; q++) maxV = Math.max(maxV, num(line[q], 0));
  }
  var showValue = cellW >= 15 && cellH >= 13;
  var cellFontPx = Math.min(11.5, Math.max(8, Math.min(cellW * 0.5, cellH * 0.55)));

  drawPanelLabel(ctx, 'A', 2, 2);

  for (var i = 0; i < rows.length; i++) {
    var rowVals = values[i] || [];
    for (var j2 = 0; j2 < cols.length; j2++) {
      var val = num(rowVals[j2], 0);
      var rgb = val > 0 ? viridisRGB(val / maxV) : [245, 245, 245];
      var x = padL + j2 * cellW, y = padT + i * cellH;
      ctx.fillStyle = rgbCss(rgb);
      ctx.fillRect(x, y, cellW, cellH);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 0.75;
      ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(cellW) - 1, Math.round(cellH) - 1);
      if (showValue) {
        ctx.font = axisFont(cellFontPx);
        ctx.fillStyle = val > 0 ? textOn(rgb) : MUTED;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val > 0 ? fmtInt(val) : '·', x + cellW / 2, y + cellH / 2);
      }
    }
  }

  // 行/列字符标签
  ctx.font = tickFont(11);
  ctx.fillStyle = INK;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var i2 = 0; i2 < rows.length; i2++) {
    ctx.fillText(ellipsize(ctx, text(rows[i2]), padL - 6, tickFont(11)),
      padL - 6, padT + i2 * cellH + cellH / 2);
  }
  ctx.save();
  ctx.textBaseline = 'bottom';
  for (var j3 = 0; j3 < cols.length; j3++) {
    var cx = padL + j3 * cellW + cellW / 2;
    ctx.save();
    ctx.translate(cx, padT - 4);
    ctx.rotate(-Math.PI / 3);
    ctx.textAlign = 'left';
    ctx.fillText(ellipsize(ctx, text(cols[j3]), cellH + 8, tickFont(11)), 0, 0);
    ctx.restore();
  }
  ctx.restore();

  ctx.save();
  ctx.font = labelFont(11.5);
  ctx.fillStyle = INK;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('后继字符', padL + gridW / 2, padT - 8);
  ctx.save();
  ctx.translate(11, padT + gridH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText('前驱字符', 0, 0);
  ctx.restore();
  ctx.restore();

  drawColorbar(ctx, padL, c.h - 28, Math.min(240, gridW - 20), 8, '0', fmtInt(maxV), '权重');
}

/** 转移网络图：中心 + 左前驱圈 + 右后继圈 */
function drawNetwork(canvas, graph, center) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  var nodes = (graph && graph.nodes) || [];
  var links = (graph && graph.links) || [];
  if (!nodes.length) {
    drawNoData(ctx, 0, 0, c.w, c.h, '暂无转移数据');
    return;
  }
  drawPanelLabel(ctx, 'B', 2, 2);
  var cx = c.w / 2, cy = c.h / 2 + 8;

  var byKind = { center: [], prev: [], next: [] };
  nodes.forEach(function (n) {
    var k = n.kind === 'center' ? 'center' : (n.kind === 'prev' ? 'prev' : 'next');
    byKind[k].push(n);
  });
  var centerNode = byKind.center[0] || { id: center || '', kind: 'center', w: 0, share: 1 };

  var all = byKind.prev.concat(byKind.next);
  var maxW = 1;
  all.forEach(function (n) { maxW = Math.max(maxW, num(n.w, 0)); });
  var base = Math.max(9, Math.min(26, Math.min(c.w, c.h) / 16));
  var R = function (w) {
    var t = Math.sqrt(Math.max(0, num(w, 0)) / maxW);
    return base * (0.5 + 0.9 * t);
  };

  // 连线先用浅色画一遍，保证节点不被线盖住
  var pos = {};
  pos[centerNode.id] = { x: cx, y: cy, r: base * 1.35, kind: 'center' };
  var prevs = byKind.prev, nexts = byKind.next;
  var radius = Math.min(c.h / 2 - 26, (c.w / 2) * 0.52);
  radius = Math.max(60, radius);
  prevs.forEach(function (n, i) {
    var a = prevs.length === 1 ? Math.PI : (Math.PI * 0.58 + Math.PI * 0.84 * (i / Math.max(1, prevs.length - 1)));
    pos[n.id] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius, r: R(n.w), kind: 'prev' };
  });
  nexts.forEach(function (n, i) {
    var a = nexts.length === 1 ? 0 : (-Math.PI * 0.42 + Math.PI * 0.84 * (i / Math.max(1, nexts.length - 1)));
    pos[n.id] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius, r: R(n.w), kind: 'next' };
  });

  var maxLinkW = 1;
  links.forEach(function (l) { maxLinkW = Math.max(maxLinkW, num(l.w, 0)); });

  links.forEach(function (l) {
    var a = pos[l.source], b = pos[l.target];
    if (!a || !b) return;
    var w = Math.max(0.8, Math.sqrt(num(l.w, 0) / maxLinkW) * 4.6);
    var col = l.kind === 'in' ? IN_COLOR : OUT_COLOR;
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len;
    var sx = a.x + ux * a.r, sy = a.y + uy * a.r;
    var tx = b.x - ux * (b.r + 5), ty = b.y - uy * (b.r + 5);
    ctx.save();
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.75;
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.restore();
    // 箭头
    var ah = Math.max(4.5, w * 2.1);
    ctx.save();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - ux * ah + uy * ah * 0.45, ty - uy * ah - ux * ah * 0.45);
    ctx.lineTo(tx - ux * ah - uy * ah * 0.45, ty - uy * ah + ux * ah * 0.45);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  nodes.forEach(function (n) {
    var p = pos[n.id];
    if (!p) return;
    var col = n.kind === 'prev' ? IN_COLOR : (n.kind === 'next' ? OUT_COLOR : '#111111');
    ctx.save();
    ctx.globalAlpha = n.kind === 'center' ? 1 : 0.9;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.font = boldFont(Math.max(9, Math.min(12.5, p.r * 0.95)));
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ellipsize(ctx, text(n.id), p.r * 1.7, boldFont(Math.max(9, Math.min(12.5, p.r * 0.95)))),
      p.x, p.y);
    ctx.restore();
    // 节点旁直接标字符与权重
    var label = n.kind === 'center' ? (text(n.id) + '  中心') : (text(n.id) + '  ' + fmtInt(num(n.w, 0)));
    ctx.save();
    ctx.font = tickFont(10.5);
    ctx.fillStyle = INK;
    var toRight = p.x >= cx;
    ctx.textAlign = toRight ? 'left' : 'right';
    ctx.textBaseline = 'middle';
    var lx = p.x + (toRight ? p.r + 5 : -(p.r + 5));
    lx = Math.max(3, Math.min(c.w - 3, lx));
    ctx.fillText(ellipsize(ctx, label, toRight ? c.w - lx - 3 : lx - 3, tickFont(10.5)), lx, p.y);
    ctx.restore();
  });

  // in / out 图例
  ctx.save();
  ctx.font = tickFont(10.5);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  var lx0 = 6, ly0 = c.h - 12;
  ctx.fillStyle = IN_COLOR;
  ctx.beginPath(); ctx.arc(lx0 + 5, ly0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK;
  ctx.fillText('前驱 → 中心（入）', lx0 + 13, ly0);
  var off = lx0 + 13 + measure(ctx, '前驱 → 中心（入）', tickFont(10.5)) + 22;
  ctx.fillStyle = OUT_COLOR;
  ctx.beginPath(); ctx.arc(off + 5, ly0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = INK;
  ctx.fillText('中心 → 后继（出）', off + 13, ly0);
  ctx.restore();
}

/* =========================================================================
 * 5. 与后端通信
 * ====================================================================== */
function request(method, path, query, body) {
  var url = path;
  if (query) {
    var parts = [];
    Object.keys(query).forEach(function (k) {
      if (query[k] === null || query[k] === undefined) return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(query[k]));
    });
    if (parts.length) url += '?' + parts.join('&');
  }
  var init = { method: method, cache: 'no-store', headers: { 'Accept': 'application/json' } };
  if (method === 'POST') {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(body || {});
  }
  return fetch(url, init).then(function (res) {
    return res.text().then(function (raw) {
      var data = null;
      try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
      if (!res.ok) {
        var msg = (data && data.error) ? data.error : ('请求失败（HTTP ' + res.status + '）');
        var err = new Error(msg);
        err.status = res.status;
        throw err;
      }
      if (data === null || typeof data !== 'object') throw new Error('后端返回了非法 JSON');
      return data;
    });
  }, function () {
    throw new Error('无法连接后端（' + path + '），请确认管理后台进程仍在运行');
  });
}

/** GET 并缓存 */
function get(key, path, query) {
  return request('GET', path, query).then(function (data) {
    cache[key] = data;
    return data;
  });
}

function wireBansShell(group) {
  var sel = document.getElementById('ban-group');
  if (sel) sel.addEventListener('change', function () {
    state.group = sel.value;
    if (cache.overview) {
      var g = findGroup(state.group);
      if (g) { /* 保持 overview 中的模型信息 */ }
    }
    clearError();
    renderBans();
    loadBans(state.group);
  });
  wireSeg('ban-model', 'modelSeg', function (model) { postModel(group, model); });
  var dstx = document.getElementById('dstx-btn');
  if (dstx) dstx.addEventListener('click', function () {
    if (!window.confirm('确定要对所有群执行「大赦天下」并清空全部封禁记录吗？')) return;
    dstx.disabled = true;
    dstx.textContent = '处理中…';
    request('POST', '/api/dstx', null, {}).then(function (data) {
      var released = data.released || [];
      banner(document.getElementById('ban-msg'), 'ok',
        '大赦天下完成，共释放 ' + released.length + ' 个账号：',
        released.length ? released.join('、') : '（本来就没有封禁）');
      refreshBans(group, true);
    }).catch(function (err) {
      banner(document.getElementById('ban-msg'), 'error', '大赦天下失败：', err.message);
    }).then(function () {
      dstx.disabled = false;
      dstx.textContent = '大赦天下（POST /api/dstx）';
    });
  });
  var rf = document.getElementById('ban-refresh');
  if (rf) rf.addEventListener('click', function () { refreshBans(group, true); });
}

function loadBans(group) {
  return get('bans', '/api/bans', { group: group }).then(function () {
    clearError();
    if (state.page === 'bans' && String(state.group) === String(group)) renderBans();
  }).catch(function (err) {
    showError(err.message);
    if (state.page === 'bans') {
      var host = document.getElementById('ban-msg');
      if (host) banner(host, 'error', '加载封禁数据失败：', err.message);
    }
  });
}

function refreshBans(group, force) {
  cache.bans = null;
  return loadBans(group);
}

/** 通用 POST：成功后显示绿色提示并回调 */
function post(path, body, successText, hostId, then) {
  var host = hostId ? document.getElementById(hostId) : null;
  if (host) host.innerHTML = '<div class="banner">请求中…</div>';
  return request('POST', path, null, body).then(function () {
    clearError();
    if (host) banner(host, 'ok', successText, '');
    if (then) then();
    if (state.page !== 'system') refreshCurrent(true);
  }).catch(function (err) {
    showError(err.message);
    if (host) banner(host, 'error', successText + '失败：', err.message);
  });
}

/**
 * 切换模型。onSuccess(model) 用于就地更新分段控件，避免整页重渲染打断表单输入。
 */
function postModel(group, model, onSuccess) {
  // 提示要写进「当前可见」的容器：训练页用 #model-msg，封禁页用 #ban-msg，
  // 数据大屏用每群卡片里的 #model-msg-<群号>。
  var host = state.page === 'train'
    ? (document.getElementById('model-msg') || document.getElementById('ban-msg'))
    : (state.page === 'overview'
      ? (document.getElementById('model-msg-' + group) || document.getElementById('ban-msg'))
      : (document.getElementById('ban-msg') || document.getElementById('model-msg')));
  var kept = keepMessages(['model-msg', 'model-msg-' + group]);
  return request('POST', '/api/model', null, { group: group, model: model }).then(function () {
    clearError();
    var g = findGroup(group);
    if (g) g.model = model;
    var seg = document.getElementById('ban-model') || document.getElementById('train-model') ||
      document.getElementById('model-' + group);
    if (seg) {
      Array.prototype.forEach.call(seg.querySelectorAll('button[data-value]'), function (b) {
        b.classList.toggle('on', String(b.dataset.value) === String(model));
      });
    }
    if (onSuccess) onSuccess(model);
    if (host) banner(host, 'ok', groupLabel(group) + ' 已切换为 ' + model, '');
    // 后台静默刷新概况，保持卡片与表格里的模型一致；提示条重渲染后补回
    get('overview', '/api/overview').then(function () {
      if (state.page === 'overview') renderOverview();
      else if (state.page === 'train') restoreMessages(kept);
    }).catch(function () { /* 概况刷新失败不打断当前操作 */ });
  }).catch(function (err) {
    showError(err.message);
    if (host) banner(host, 'error', '切换模型失败：', err.message);
  });
}

/** 把后端返回的任意 summary/report 对象渲染成一行文字，避免 [object Object] */
function summarizeReport(obj) {
  if (!obj || typeof obj !== 'object') return '';
  var parts = [];
  Object.keys(obj).forEach(function (k) {
    var v = obj[k];
    if (v === null || v === undefined) return;
    if (typeof v === 'object') {
      var inner = summarizeReport(v);
      if (inner) parts.push(k + '={' + inner + '}');
    } else {
      parts.push(k + '=' + v);
    }
  });
  return parts.join('  ');
}

function refreshTrainData() {
  if (!state.group) return;
  var group = state.group;
  var query = { group: group };
  Object.keys(genUserParam()).forEach(function (k) { query[k] = genUserParam()[k]; });
  var tasks = [];
  tasks.push(get('match', '/api/match', { group: group }).catch(function (err) {
    if (state.page === 'train') banner(document.getElementById('train-body'), 'error', '加载 match 数据失败：', err.message);
    else showError(err.message);
  }));
  tasks.push(get('generate', '/api/generate', query).catch(function (err) {
    if (state.page === 'train') banner(document.getElementById('train-body'), 'error', '加载 generate 数据失败：', err.message);
    else showError(err.message);
  }));
  tasks.push(get('generateUsers', '/api/generate/users', { group: group }).catch(function (err) {
    if (state.page === 'train') banner(document.getElementById('train-body'), 'error', '加载 QQ 列表失败：', err.message);
    else showError(err.message);
  }));
  tasks.push(request('GET', '/api/loops', { group: group }).then(function (data) {
    if (String(state.group) === String(group)) cache.loops = data;
  }).catch(function (err) {
    if (state.page === 'train') banner(document.getElementById('train-body'), 'error', '加载回环列表失败：', err.message);
    else showError(err.message);
  }));
  return Promise.all(tasks).then(function () {
    if (state.page === 'train' && String(state.group) === String(group)) renderTrainBody();
  });
}

/** 面板重渲染前暂存若干提示容器，避免成功的绿色提示条被立刻抹掉 */
function keepMessages(ids) {
  var kept = {};
  ids.forEach(function (id) {
    var el = document.getElementById(id);
    if (el && el.innerHTML) kept[id] = el.innerHTML;
  });
  return kept;
}

function restoreMessages(kept) {
  Object.keys(kept || {}).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = kept[id];
  });
}

/**
 * 表单状态保护：重渲染前记下所有输入控件的值，渲染后写回。
 * 定时刷新与手动刷新都不允许清空用户正在填写的内容。
 */
function captureFormState(root) {
  var scope = root || document;
  var snapshot = {};
  Array.prototype.forEach.call(scope.querySelectorAll('input, select, textarea'), function (el) {
    if (!el.id) return;
    if (el.type === 'radio' || el.type === 'checkbox') snapshot[el.id] = { checked: el.checked };
    else snapshot[el.id] = { value: el.value };
  });
  return snapshot;
}

function applyFormState(snapshot) {
  if (!snapshot) return;
  Object.keys(snapshot).forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    var saved = snapshot[id];
    if (saved && saved.checked !== undefined) el.checked = saved.checked;
    else if (saved && saved.value !== undefined && saved.value !== '') el.value = saved.value;
  });
}

/* --------------------------------------------------------------------------
 * IME（拼音等）友好输入：
 * 组合期间（isComposing / compositionstart..end）绝不校验、不截断、不重渲染，
 * 只在提交时用 Array.from 取首个字符，避免把代理对（emoji）切坏。
 * ------------------------------------------------------------------------ */
function isComposing(ev) {
  return !!(ev && (ev.isComposing || ev.keyCode === 229));
}

/** 绑定「提交快捷键 + IME 安全」：组合中（拼音候选）绝不触发提交、不改动输入框 */
function bindSubmitInput(el, onCommit, opts) {
  if (!el) return;
  var textarea = el.tagName === 'TEXTAREA';
  var ctrlOnly = !!(opts && opts.ctrlEnter) || textarea;   // 文本域里回车换行是正常输入
  el.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter' || isComposing(ev)) return;
    if (ctrlOnly && !(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    onCommit(ev);
  });
  el.addEventListener('compositionstart', function () { el.dataset.composing = '1'; });
  el.addEventListener('compositionend', function () { delete el.dataset.composing; });
}

/** 输入类控件的统一行为：不做任何长度截断与字符过滤，只在提交时校验 */
function readInput(id) {
  var el = document.getElementById(id);
  return el ? String(el.value || '').trim() : '';
}

/** 缓存里的 generate / explore 数据是否属于当前选中的作用域 */
function cacheScopeMatches(entry) {
  if (!entry) return false;
  var scope = entry.scope === 'user' ? 'user' : 'all';
  if (scope !== (state.genUser ? 'user' : 'all')) return false;
  if (scope === 'user') return String(entry.user || '') === String(state.genUser);
  return true;
}

function userShort(user) { return user ? ('QQ ' + user) : '全部数据'; }

/** 只把非空值写进 query，避免 ?user=null 这类脏参数 */
function genUserParam() { return state.genUser ? { user: state.genUser } : {}; }

function sendersFromCache() {
  var d = cache.generateUsers;
  return (d && d.senders) || [];
}

function attributionOf() {
  // 优先用 generate 自带的 attribution（与当前作用域同一次查询），否则退回 users 接口
  if (cache.generate && cache.generate.attribution) return cache.generate.attribution;
  if (cache.generateUsers && cache.generateUsers.attribution) return cache.generateUsers.attribution;
  return null;
}

/** 当前筛选态标签 */
function scopeTagHtml() {
  if (state.genUser) {
    return '<span class="scope-tag">当前作用域：QQ ' + esc(state.genUser) + '</span>';
  }
  return '<span class="scope-tag all">当前作用域：全部数据</span>';
}

/**
 * 归属覆盖率提示。这是诚实性提示，必须始终显示：
 * 按 QQ 筛选只能看到「带发送者归属」的那部分权值。
 */
function attributionBannerHtml() {
  var a = attributionOf();
  if (!a) {
    return '<div class="banner">正在读取归属覆盖率（GET /api/generate/users）…</div>';
  }
  var total = num(a.total_weight, 0);
  var attributed = num(a.attributed_weight, 0);
  var cover = num(a.coverage, 0);
  var senders = num(a.senders, 0);
  var pct = (cover * 100).toFixed(1) + '%';
  // 纯文本（由 banner() 统一转义），避免出现裸露的标签
  var detail = '按 QQ 筛选仅覆盖 ' + pct + ' 的权值（' + fmtInt(attributed) + ' / ' +
    fmtInt(total) + '），其余为历史数据、无发送者归属。';
  if (total <= 0) {
    return '<div class="banner">该群 total_weight = 0，模型尚未训练出任何转移；按 QQ 筛选同样为空。</div>';
  }
  if (attributed <= 0 || cover <= 0) {
    return '<div class="banner warn"><span class="head">无归属数据：</span>' + esc(detail) +
      ' 该群暂无带归属的数据，请先让机器人学习新消息或导入带 QQ 号的文本。</div>';
  }
  if (cover < 0.9999) {
    return '<div class="banner warn"><span class="head">归属不完全：</span>' + esc(detail) +
      ' 涉及 ' + fmtInt(senders) + ' 个 QQ。</div>';
  }
  return '<div class="banner ok"><span class="head">归属完整：</span>全部权值都能追溯到发送者（' +
    esc(fmtInt(attributed)) + ' / ' + esc(fmtInt(total)) + '，' + fmtInt(senders) + ' 个 QQ）。</div>';
}

/** 作用域下拉框（senders 为空时也不会报错，只显示一项「全部数据」+ 说明） */
function scopeSelectorHtml() {
  var senders = sendersFromCache();

        }).join('') +

        ? '共 ' + fmtInt(senders.length) + ' 个有归属的 QQ（按权值降序）'
        : '该群暂无带归属的 QQ（user_chars 为空）') + '</span>' +

function wireScopeSelector(group) {
  var sel = document.getElementById('scope-user');
  if (sel) {
    sel.addEventListener('change', function () {
      setGenUser(group, sel.value || null);
    });
  }
