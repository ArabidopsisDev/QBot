}

/** 切换作用域：作废旧的派生缓存，重新拉取并重绘整块 generate 面板 */
function setGenUser(group, user) {
  var next = user ? String(user) : null;
  if (String(next) === String(state.genUser || '')) {
    // 已经是该作用域（例如清除筛选后重新选择）也要把下拉框同步回去
    var sel = document.getElementById('scope-user');
    if (sel) sel.value = next || '';
    return;
  }
  state.genUser = next;
  state.pair = null;
  cache.generate = null;
  cache.pairDetail = null;
  cache.explore = null;
  var sl = document.getElementById('scope-user');
  if (sl) sl.value = next || '';
  var clr = document.getElementById('scope-clear');
  if (clr) clr.classList.toggle('hidden', !next);
  clearError();
  if (state.page === 'train' && state.trainTab === 'generate') renderTrainBody();
  refreshTrainData();
}

/* =========================================================================
 * 9c. 三级下钻：单条转移详情（GET /api/generate/pair）
 * ====================================================================== */

function pairKey(first, second) { return String(first) + '\u0000' + String(second); }

function isPairOpen(first, second) {
  return !!state.pair && state.pair.first === String(first) && state.pair.second === String(second);
}

/** 表格行通用属性：可点击 + 键盘可达 */
function rowAttrs(first, second, extraClass) {
  return ' class="rowlink' + (isPairOpen(first, second) ? ' on' : '') + (extraClass ? ' ' + extraClass : '') +
    '" tabindex="0" role="button" title="点击查看这条转移的详情"' +
    ' data-first="' + esc(first) + '" data-second="' + esc(second) + '"';
}

function wireClickableRows(root) {
  if (!root) return;
  Array.prototype.forEach.call(root.querySelectorAll('tr.rowlink'), function (tr) {
    var open = function () { openPairDetail(state.group, tr.dataset.first, tr.dataset.second); };
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
  });
}

function findPairRow(first, second) {
  var top = (cache.generate && cache.generate.top) || [];
  for (var i = 0; i < top.length; i++) {
    if (String(top[i].first) === String(first) && String(top[i].second) === String(second)) return top[i];
  }
  return null;
}

/** 打开 / 收起转移详情。group 省略时用当前选中的群。 */
function openPairDetail(group, first, second) {
  var gid = group || state.group;
  if (!gid) return;
  var f = String(first === undefined || first === null ? '' : first);
  var s = String(second === undefined || second === null ? '' : second);
  if (isPairOpen(f, s)) { closePairDetail(); return; }
  state.pair = { first: f, second: s };
  cache.pairDetail = null;
  var host = document.getElementById('pair-detail-host');
  if (host) host.innerHTML = '<div class="card"><h2>转移详情</h2><p class="sub">正在加载 GET /api/generate/pair …</p></div>';
  wireClickableRows(document.getElementById('train-body'));
  request('GET', '/api/generate/pair', { group: gid, first: f, second: s }).then(function (data) {
    // 期间用户可能切换了作用域、群或关闭了面板
    if (!isPairOpen(f, s) || String(gid) !== String(state.group)) return;
    cache.pairDetail = data;
    clearError();
    renderPairDetail();
  }).catch(function (err) {
    cache.pairDetail = null;
    showError(err.message);
    var h = document.getElementById('pair-detail-host');
    if (h && isPairOpen(f, s)) {
      h.innerHTML = '<div class="card"><h2>转移详情</h2>' +
        '<div class="banner error"><span class="head">加载失败：</span>' + esc(err.message) + '</div>' +
        '<button type="button" class="btn" id="pair-close2">关闭</button></div>';
      var c2 = document.getElementById('pair-close2');
      if (c2) c2.addEventListener('click', closePairDetail);
    }
  });
}

function closePairDetail() {
  state.pair = null;
  cache.pairDetail = null;
  var host = document.getElementById('pair-detail-host');
  if (host) host.innerHTML = '';
  wireClickableRows(document.getElementById('train-body'));
}

function renderPairDetail() {
  var host = document.getElementById('pair-detail-host');
  if (!host) return;
  var d = cache.pairDetail;
  if (!d || !state.pair) { host.innerHTML = ''; return; }

  var first = d.first === undefined ? state.pair.first : String(d.first);
  var second = d.second === undefined ? state.pair.second : String(d.second);
  var w = num(d.weight, 0);
  var rank = (d.rank === null || d.rank === undefined || !isNum(Number(d.rank))) ? null : Number(d.rank);
  var totalTrans = num(d.total_transitions, 0);
  var distinctUsers = num(d.distinct_users, 0);
  var contributors = d.contributors || [];
  var fallback = !contributors.length ? findPairRow(first, second) : null;

  var html = '<div class="grid two"><div class="card span-all">';
  html += '<div class="pair-head">' +
    '<div class="grow">' +
      '<div class="pair-title">' + esc(first === '' ? '∅（句首）' : charLabel(first)) +
        '<span class="arrow">→</span>' + esc(second === '' ? '∅（结束）' : charLabel(second)) +
        '<span class="u">单条转移详情 · GET /api/generate/pair</span></div>' +
      '<p class="sub" style="margin:6px 0 0 0">排名按全群聚合模型（chars 表）的权重降序计算，' +
        '与上方作用域筛选无关；贡献者来自 user_chars 的发送者归属。</p>' +
    '</div>' +
    '<div><button type="button" class="btn" id="pair-close">关闭</button></div>' +
    '</div>';

  html += miniChips([
    chip('权重 weight', fmtInt(w), ''),
    chip('占比 share', fmtPct(d.share, 2), ''),
    chip('排名 rank', rank === null ? '未收录' : ('第 ' + fmtInt(rank) + ' / ' + fmtInt(totalTrans) + ' 名'), ''),
    chip('贡献者数', fmtInt(distinctUsers), '个 QQ'),
    chip('归属权值 attributed_weight', fmtInt(d.attributed_weight), '')
  ]);

  if (rank === null && w <= 0) {
    html += '<div class="banner warn"><span class="head">未收录：</span>' +
      '这条转移在当前群的聚合模型里权重为 0，尚未被训练记录。</div>';
  }
  if (!contributors.length) {
    html += '<div class="banner"><span class="head">无归属明细：</span>' +
      '该转移没有发送者归属记录（历史数据）。' +
      (fallback ? ' 其权重 ' + fmtInt(w) + '、占比 ' + fmtPct(d.share, 2) + ' 来自未归属的历史语料。' : '') +
      '</div>';
  }

  // 贡献者图与表并排
  html += '<div class="grid two tight" style="margin-bottom:10px">';
  html += '<div>' +
    '<div class="section-title">贡献者权重 @ ' + esc(charLabel(first)) + ' → ' + esc(charLabel(second)) +
    '（' + fmtInt(contributors.length) + ' / ' + fmtInt(distinctUsers) + '）</div>';
  if (contributors.length) {
    html += '<canvas id="cv-pair-contrib" class="hoverable" style="width:100%;height:' +
      Math.max(120, contributors.length * 24 + 48) + 'px;display:block"></canvas>';
  } else {
    html += '<p class="empty">该转移没有发送者归属记录（历史数据）</p>';
  }
  html += '</div>';

  html += '<div><div class="section-title">贡献者明细</div>' +
    '<div class="scroll" style="max-height:300px">' +
    '<table><thead><tr>' +
    '<th class="r" style="width:40px">#</th><th>QQ 号</th><th class="r">权重 w</th>' +
    '<th class="r">占该转移</th><th class="r">相对最大</th></tr></thead><tbody>';
  if (contributors.length) {
    var maxC = 1;
    contributors.forEach(function (c) { maxC = Math.max(maxC, num(c.w, 0)); });
    contributors.forEach(function (c, i) {
      html += '<tr><td class="r muted">' + (i + 1) + '</td>' +
        '<td class="mono">' + esc(text(c.user_id)) + '</td>' +
        '<td class="r">' + fmtInt(c.w) + '</td>' +
        '<td class="r">' + fmtPct(num(c.w, 0) / Math.max(1, w), 2) + '</td>' +
        '<td class="r muted">' + fmtPct(num(c.w, 0) / maxC, 1) + '</td></tr>';
    });
  } else {
    html += '<tr><td colspan="5" class="empty">暂无数据</td></tr>';
  }
  html += '</tbody></table></div></div></div>';

  html += '<div class="toolbar" style="margin:12px 0 0 0">' +
    '<button type="button" class="btn" id="pair-adjust">调整此转移权重</button>' +
    '<span class="hint">会切换到两字模式并自动填入前字 / 后字，跳到权重调整卡片。</span>' +
    '</div>';
  html += '</div></div>';

  host.innerHTML = html;
  var close = document.getElementById('pair-close');
  if (close) close.addEventListener('click', closePairDetail);
  var adj = document.getElementById('pair-adjust');
  if (adj) adj.addEventListener('click', function () { focusAdjustForm(first, second); });

  var cv = document.getElementById('cv-pair-contrib');
  if (cv) drawContributorChart(cv, contributors, w);
  wireClickableRows(document.getElementById('train-body'));
}

/** 贡献者横条图：条色 viridis 映射 w，条尾标「w · 占该转移比例」 */
function drawContributorChart(canvas, contributors, pairWeight) {
  if (!contributors || !contributors.length) { return; }
  var maxW = 1;
  contributors.forEach(function (c) { maxW = Math.max(maxW, num(c.w, 0)); });
  drawBarChartH(canvas, {
    rows: contributors.map(function (c) {
      return {
        name: String(c.user_id === undefined || c.user_id === null ? DASH : c.user_id),
        value: num(c.w, 0),
        share: num(c.w, 0) / Math.max(1, num(pairWeight, 0))
      };
    }),
    barColor: function (r) { return vmap(r.value, 0, maxW); },
    labelWidth: 110, valueWidth: 160,
    xLabel: '权重 w（该 QQ 贡献给这条转移的整数权值）', xMaxLabel: '最大 ' + fmtInt(maxW),
    rowFont: function (px) { return (px || 11) + 'px "Cascadia Mono",Consolas,"Courier New",monospace'; },
    rowFontPx: 11.5,
    valFontPx: 11
  });
  overlayRowShares(canvas, contributors.map(function (c) {
    return { w: c.w, share: num(c.w, 0) / Math.max(1, num(pairWeight, 0)) };
  }), maxW, { labelWidth: 110, valueWidth: 160 });
}

/* ------------------------------------------------------ 跳转到权重调整表单 */
function focusAdjustForm(first, second) {
  var form = document.getElementById('adj-submit');
  if (!form) return;
  var modePair = document.querySelector('input[name="adj-mode"][value="pair"]');
  if (modePair && !modePair.checked) modePair.click();
  var f = document.getElementById('adj-first');
  var s = document.getElementById('adj-second');
  if (f) f.value = first === '' ? '' : String(first);
  if (s) s.value = second === '' ? '' : String(second);
  var card = form.closest ? form.closest('.card') : null;
  try {
    (card || form).scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (e) {
    (card || form).scrollIntoView();
  }
  var pc = document.getElementById('adj-percent');
  if (pc && pc.focus) { try { pc.focus({ preventScroll: true }); } catch (e2) { pc.focus(); } }
}

function renderTrainBody() {
  var host = document.getElementById('train-body');
  if (!host) return;
  var group = state.group;
  var html = '';
  var m = cache.match && String(cache.match.group || group) ? cache.match : null;
  var g = cacheScopeMatches(cache.generate) ? cache.generate : null;
  var loading = !!cache.generate && !g;

  if (state.trainTab === 'match') {
    html += renderMatchPanel(m);
  } else {
    html += renderGeneratePanel(g, group);
  }
  var kept = keepMessages(['adj-msg', 'ex-msg', 'loop-msg']);
  cache.loopPlan = null; // Every refreshed list requires a new verified preview.
  host.innerHTML = html;
  restoreMessages(kept);
  bindLoopCard();

  if (state.trainTab === 'match') {
    drawMatchCharts(m);
  } else if (g) {
    wireScopeSelector(group);
    drawGenerateCharts(g);
    wireAdjustForm(group);
    wireExplore(group);
    // 之前展开的转移详情：数据仍在同一作用域缓存里就直接恢复
    if (state.pair) {
      if (cache.pairDetail && String(cache.pairDetail.first) === state.pair.first &&
          String(cache.pairDetail.second) === state.pair.second) {
        renderPairDetail();
      } else {
        openPairDetail(group, state.pair.first, state.pair.second);
      }
    }
  } else {
    wireScopeSelector(group);
    if (loading) {
      var ph = document.createElement('div');
      ph.className = 'banner';
      ph.textContent = '正在按当前作用域重新加载 generate 数据…';
      host.insertBefore(ph, host.firstChild);
    }
  }
}

/* ---------------------------------------------------------- A. match 面板 */
function renderMatchPanel(m) {
  if (!m) return '<div class="card"><h2>match 模型</h2><p class="sub">正在加载 GET /api/match …</p></div>';
  var pairs = (m.pairs || []).slice(0, 200);
  var top = m.top_answers || [];
  var anomalies = m.anomalies || {};
  var html = '';
  html += chips([
    chip('问答对总数 count', fmtInt(m.count), '条'),
    chip('总权重 weight', fmtInt(m.weight), ''),
    chip('覆盖答案数', fmtInt(top.length), '个'),
    chip('中位权重 median', fmtNum(anomalies.median, 3), ''),
    chip('MAD', fmtNum(anomalies.mad, 3), '')
  ]);

  // Top 答案图与异常表并排

function drawMatchCharts(m) {

/* ------------------------------------------------------------ 数据清理卡片 */
function loopCardHtml(group) {
  var d = cache.loops && String(cache.loops.group) === String(group) ? cache.loops : null;
  var html = '<div class="card" id="loop-card">' +
    '<h2>强重复记忆清理<span class="aux">先备份 · 再清理</span></h2>' +
    '<p class="sub">只列出长而明确的连续重复：重复段占语句至少 80%，2–12 字的片段重复至少 4 次且长至少 24 字，' +
    '或同一非语气字连续至少 16 次。普通笑声、数字、网址及代码不列入。</p>';
  if (!d) {
    html += '<p class="sub">正在加载 GET /api/loops …</p></div>';
    return html;
  }
  html += chips([
    chip('新训练压缩', fmtInt(d.training_repairs || 0), '条'),
    chip('移除重复字', fmtInt(d.removed_characters || 0), '字'),
    chip('自动记忆清理', '每 5 分钟', '最多 20 条')
  ]);
  var loops = d.loops || [];
  if (!loops.length) {
    html += '<div class="banner ok" style="margin-bottom:0"><span class="head">未发现强回环：</span>' +
      '当前群的记忆语句中没有明显自重复的条目。</div></div>';
    return html;
  }
  html += chips([
    chip('强回环语句', fmtInt(loops.length), '条'),
    chip('最多连续重复', fmtInt(Math.max.apply(null, loops.map(function (r) { return r.repeats; }))), '次'),
    chip('最短周期', fmtInt(Math.min.apply(null, loops.map(function (r) { return r.width; }))), '字')
  ]);
  html += '<div class="banner warn"><span class="head">清理范围：</span>' +
    '删除选中的重复记忆、关联问答和检索链接。历史字符模型没有完整来源记录，' +
    '因此字符对、三字转移和用户归属权重均保留。执行前会保存可恢复的数据库备份；备份失败则停止清理。</div>';
  html += '<div class="scroll" style="max-height:300px"><table><thead><tr>' +
    '<th style="width:36px"><input type="checkbox" id="loop-all" title="全选"></th>' +
    '<th>语句</th><th class="r">score</th><th class="r">周期</th><th class="r">重复</th>' +
    '<th class="r">权重</th><th class="r">长度</th></tr></thead><tbody>' +
    loops.map(function (row) {
      return '<tr><td><input type="checkbox" class="loop-pick" value="' + esc(String(row.id)) + '"></td>' +
        '<td class="mono">' + esc(text(row.text)) + '</td>' +
        '<td class="r">' + fmtNum(row.score, 3) + '</td>' +
        '<td class="r">' + fmtInt(row.width) + '</td>' +
        '<td class="r">' + fmtInt(row.repeats) + '</td>' +
        '<td class="r">' + fmtInt(row.w) + '</td>' +
        '<td class="r">' + fmtInt(row.length) + '</td></tr>';
    }).join('') +
    '</tbody></table></div>';
  html += '<div class="toolbar" style="margin-top:12px">' +
    '<button type="button" class="btn" id="loop-preview">预览影响</button>' +
    '<button type="button" class="btn danger" id="loop-clean" disabled>执行清理</button>' +
    '<span class="hint">必须先预览；执行前会再次确认</span></div>' +
    '<div id="loop-plan"></div><div id="loop-msg"></div></div>';
  return html;
}

function pickedLoops() {
  return Array.prototype.filter.call(document.querySelectorAll('.loop-pick'),
    function (box) { return box.checked; }).map(function (box) { return num(box.value, 0); });
}

function bindLoopCard() {
  var card = document.getElementById('loop-card');
  if (!card) return;
  var all = document.getElementById('loop-all');
  if (all) {
    all.addEventListener('change', function () {
      Array.prototype.forEach.call(document.querySelectorAll('.loop-pick'),
        function (box) { box.checked = all.checked; });
      var run = document.getElementById('loop-clean');
      if (run) run.disabled = true;      // 选择变了，旧预览作废
      var plan = document.getElementById('loop-plan');
      if (plan) plan.innerHTML = '';
      cache.loopPlan = null;
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('.loop-pick'), function (box) {
    box.addEventListener('change', function () {
      var run = document.getElementById('loop-clean');
      if (run) run.disabled = true;
      cache.loopPlan = null;
    });
  });
  var preview = document.getElementById('loop-preview');
  if (preview) preview.addEventListener('click', previewLoops);
  var clean = document.getElementById('loop-clean');
  if (clean) clean.addEventListener('click', cleanLoops);
}

function previewLoops() {
  var ids = pickedLoops();
  var group = String(state.group);
  if (!ids.length) { showError('请先勾选要清理的语句'); return; }
  request('POST', '/api/loops/preview', null, { group: group, ids: ids }).then(function (plan) {
    if (String(state.group) !== group || String(plan.group) !== group ||
        JSON.stringify(pickedLoops()) !== JSON.stringify(ids)) return;
    cache.loopPlan = plan;
    renderLoopPlan(plan);
    var run = document.getElementById('loop-clean');
    if (run) run.disabled = false;
  }).catch(function (err) { showError(err.message); });
}

function renderLoopPlan(plan) {
  var host = document.getElementById('loop-plan');
  if (!host) return;
  var html = '<div class="section-title">影响预览（只读，尚未改动任何数据）</div>' +
    chips([
      chip('将删除记忆', fmtInt(plan.sentences.length), '条'),
      chip('关联问答', fmtInt(plan.qa_rows), '行'),
      chip('字符权重改动', '0', ''),
      chip('执行前备份', '自动', '')
    ]);
  if (!plan.changes.length) {
    html += '<div class="banner"><span class="head">历史权重受保护：</span>' +
      '清理只影响以上记忆及其相关问答、检索链接。字符对、三字转移和用户归属表均保留。</div>';
  } else {
    html += '<div class="scroll" style="max-height:220px"><table><thead><tr>' +
      '<th>前</th><th>后</th><th class="r">现有</th><th class="r">扣减</th>' +
      '<th class="r">剩余</th><th>动作</th></tr></thead><tbody>' +
      plan.changes.map(function (row) {
        return '<tr><td class="mono">' + esc(charLabel(row.first)) + '</td>' +
          '<td class="mono">' + esc(charLabel(row.second)) + '</td>' +
          '<td class="r">' + fmtInt(row.before) + '</td>' +
          '<td class="r">' + fmtInt(row.subtract) + '</td>' +
          '<td class="r">' + fmtInt(row.after) + '</td>' +
          '<td>' + (row.action === 'delete' ? '删除整行' : '仅削减') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  host.innerHTML = html;
}

function cleanLoops() {
  var plan = cache.loopPlan;
  if (!plan) { showError('请先预览影响'); return; }
  if (String(plan.group) !== String(state.group)) { cache.loopPlan = null; showError('目标群已变化，请重新预览'); return; }
  var confirmText = '将删除 ' + fmtInt(plan.sentences.length) + ' 条记忆条目，' +
    '移除相关问答 ' + fmtInt(plan.qa_rows) + ' 行。\n\n' +
    '字符对、三字转移和用户归属权重保留。执行前会自动备份数据库。确定继续？';
  if (!window.confirm(confirmText)) return;
  request('POST', '/api/loops/clean', null,
    { group: plan.group, ids: plan.sentences.map(function (item) { return item.id; }), plan_token: plan.plan_token }
  ).then(function (report) {
    cache.loopPlan = null;
    var box = String(state.group) === String(report.group) ? document.getElementById('loop-msg') : null;
    if (box) {
      banner(box, 'ok', '清理完成：', '删除记忆 ' + fmtInt(report.sentences_removed) +
        ' 条、相关问答 ' + fmtInt(report.qa_rows_removed) + ' 行；历史字符权重保留。备份：' + report.backup);
    }
    refreshTrainData();
  }).catch(function (err) { showError(err.message); });
}

function purgeCardHtml(group) {
  var d = cache.nonChinese;
  var html = '<div class="card" id="purge-card">' +
    '<h2>非中文转移<span class="aux">保留未计入</span></h2>' +
    '<p class="sub">generate 只把<b>中文字符之间</b>的相邻对计入模型：英文、数字、标点、符号、空格与 emoji ' +
    '既不写入模型，也不参与生成，更不会作为生成起点。历史数据里已经存在的非中文转移' +
    '<b>全部保留在库中、不做任何删除</b>，但生成时会被整条跳过，因此不会影响回复。</p>';
  if (!d) {
    html += '<p class="sub">正在加载 GET /api/generate/non_chinese …</p></div>';
    return html;
  }
  var rows = num(d.rows, 0), weight = num(d.weight, 0);
  var totalRows = num(d.total_rows, 0), totalWeight = num(d.total_weight, 0);
  var rowPct = totalRows ? rows / totalRows : 0;
  var weightPct = num(d.weight_share, totalWeight ? weight / totalWeight : 0);
  var samples = d.samples || [];

  html += '<div class="mini-chips">' +
    chip('非中文转移', fmtInt(rows), '条') +
    chip('占总转移', fmtPct(rowPct, 2), '') +
    chip('占用权值', fmtInt(weight), '') +
    chip('占总权值', fmtPct(weightPct, 2), '') +
    '</div>';

  // 占比条（细、单色、中性，科研风格）
  html += '<div class="dist" title="非中文转移占总转移的比例"><span style="width:' +
    (Math.min(1, rowPct) * 100).toFixed(2) + '%;background:#7a7a7a"></span></div>' +
    '<div class="muted" style="font-size:11px;margin:4px 0 10px 0">' + fmtInt(rows) + ' / ' + fmtInt(totalRows) +
    ' 条转移为非中文（' + fmtPct(rowPct, 2) + '）</div>';

  if (rows <= 0) {
    html += '<div class="banner ok" style="margin-bottom:0"><span class="head">全部为中文：</span>' +
      '当前群没有任何非中文转移。</div></div>';
    return html;
  }

  html += '<p class="muted" style="font-size:12px;margin:0 0 10px 0">' +
    '这些行仍然占用 ' + fmtInt(weight) + ' 权值（' + fmtPct(weightPct, 2) + '）：模型照常学习并' +
    '使用它们（回复需要标点），只是本页图表按「只计中文」的口径排除了它们，' +
    '以免英文、数字与符号干扰对中文搭配的观察。数据保留，无需也无法在此删除。</p>';

  html += '<div class="section-title">示例（前 ' + fmtInt(Math.min(samples.length, 8)) + ' 条）</div>';
  html += '<div class="scroll" style="max-height:170px"><table><thead><tr>' +
    '<th>first</th><th>second</th><th class="r">w</th></tr></thead><tbody>' +
    (samples.length ? samples.slice(0, 8).map(function (s) {
      return '<tr><td class="mono">' + esc(charLabel(s.first)) + '</td>' +
        '<td class="mono">' + esc(charLabel(s.second)) + '</td>' +
        '<td class="r">' + fmtInt(s.w) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">暂无样例</td></tr>') +
    '</tbody></table></div></div>';
  return html;
}

/** 把不可见字符显示成可读形式（空格 / 换行 / 制表符等） */
function charLabel(ch) {
  if (ch === undefined || ch === null || ch === '') return '∅';
  var s = String(ch);
  return s.replace(/[\s]/g, function (m) {
    return m === '\n' ? '⏎' : (m === '\t' ? '⇥' : (m === ' ' ? '␣' : '␠'));
  });
}

function anomalyTable(title, rows, cls) {
  var list = rows || [];
  return '<div>' +
    '<div class="section-title" style="margin-top:6px">' + esc(title) + '（' + fmtInt(list.length) + '）</div>' +
    '<div class="scroll" style="max-height:250px"><table><thead><tr>' +
    '<th>first</th><th>second</th><th class="r">w</th><th class="r">share</th><th class="r">z</th>' +

function drawGenerateCharts(g) {
  var histCv = document.getElementById('cv-gen-hist');
  if (histCv) drawHistogram(histCv, (g && g.histogram) || null, null);
  var topCv = document.getElementById('cv-gen-top');
  if (!topCv) return;
  var top = ((g && g.top) || []).slice(0, 20);
  if (!top.length) {
    topCv.onclick = null;
    topCv.__hbarDraw = null;
    topCv.__geo = null;
    emptyCanvas(topCv, '暂无数据');
    return;
  }
  // 供悬停/点击命中测试与自动化检查读取的当前行集合
  topCv.__rows = top;
  var maxW = 1;
  top.forEach(function (r) { maxW = Math.max(maxW, num(r.w, 0)); });
  var rows = top.map(function (r) {
    var f = r.first === '' ? '∅' : String(r.first);
    var s = r.second === '' ? '∅结束' : String(r.second);
    return { name: f + ' → ' + s, value: num(r.w, 0), share: num(r.share, 0), first: r.first, second: r.second };
  });
  var opt = {
    rows: rows,
    barColor: function (r) { return vmap(r.value, 0, maxW); },
    labelWidth: 170, valueWidth: 150,
    xLabel: '权重 w（整数）', xMaxLabel: '最大 ' + fmtInt(maxW),
    valFontPx: 11,
    rowFontPx: 12
  };
  var hoverIndex = -1;
  var drawAll = function () {
    var geo = drawBarChartH(topCv, opt);
    overlayShares(topCv, top, maxW);
    if (hoverIndex >= 0 && hoverIndex < rows.length && geo) {
      paintHBarHover(topCv, rows, geo, hoverIndex, opt);
    }
    return geo;
  };
  topCv.__hbarDraw = drawAll;
  var geo0 = drawAll();

  // 鼠标悬停高亮（手型 + 整行浅底）
  if (topCv.dataset.genTopHover !== '1') {
    topCv.dataset.genTopHover = '1';
    topCv.addEventListener('mousemove', function (ev) {
      var rect = topCv.getBoundingClientRect();
      var geo = topCv.__geo;
      if (!geo) return;
      var idx = Math.floor((ev.clientY - rect.top - geo.top) / geo.rowH);
      if (idx < 0 || idx >= rows.length) idx = -1;
      if (idx === hoverIndex) return;
      hoverIndex = idx;
      drawAll();
    });
    topCv.addEventListener('mouseleave', function () {
      if (hoverIndex === -1) return;
      hoverIndex = -1;
      drawAll();
    });
  } else {
    hoverIndex = -1;
  }
  topCv.__geo = geo0;

  // 点击某一条 → 下钻到该转移详情
  topCv.onclick = function (ev) {
    var rect = topCv.getBoundingClientRect();
    var geo = topCv.__geo;
    if (!geo) return;
    var idx = Math.floor((ev.clientY - rect.top - geo.top) / geo.rowH);
    if (idx < 0 || idx >= rows.length) return;
    openPairDetail(state.group, rows[idx].first, rows[idx].second);
  };
}

/** Top 转移条尾的「w（share%）」标注 */
function overlayShares(canvas, rows, maxW) {
  overlayRowShares(canvas, rows, maxW, { labelWidth: 170, valueWidth: 150 });
}

/** 在横条条尾补写「w  share%」（依赖 drawBarChartH 的几何约定） */
function overlayRowShares(canvas, rows, maxW, opt) {
  var o = opt || {};
  var padL = num(o.labelWidth, 170), padR = num(o.valueWidth, 150);
  var rect = canvas.getBoundingClientRect();
  var w = Math.round(rect.width), h = Math.round(rect.height);
  if (!w || !h || !rows.length) return;
  var ctx = canvas.getContext('2d');
  ctx.save();
  ctx.font = tickFont(11);
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  var top = 8, bottom = h - 26;
  var rowH = Math.max(9, (bottom - top) / rows.length);
  var barH = Math.min(18, rowH * 0.7);
  var L = padL, R = w - padR;
  rows.forEach(function (r, i) {
    var y = top + i * rowH + (rowH - barH) / 2;
    var bw = num(r.w, 0) / maxW * (R - L);
    var x = L + Math.max(bw, 0.8) + 6;
    ctx.fillStyle = INK;
    ctx.fillText(fmtInt(r.w) + '  ' + fmtPct(r.share, 2), x, y + barH / 2);
  });
  ctx.restore();
}

function wireAdjustForm(group) {
  var modeInputs = document.querySelectorAll('input[name="adj-mode"]');
  var pairRow = document.getElementById('adj-pair-row');
  var sentRow = document.getElementById('adj-sentence-row');
  var percent = document.getElementById('adj-percent');
  var preview = document.getElementById('adj-preview');
  var g = cache.generate || {};
  var total = num(g.total_weight, 0);

  function currentMode() {
    var v = 'pair';
    Array.prototype.forEach.call(modeInputs, function (i) { if (i.checked) v = i.value; });
    return v;
  }
  function updatePreview() {
    var p = parseFloat(percent.value);
    if (!isFinite(p)) p = 0;
    var delta = Math.round(total * p / 100);
    preview.innerHTML = '当前群 total_weight = <b>' + fmtInt(total) + '</b>；percent = <b>' + esc(fmtNum(p, 3)) +
      '</b> → delta ≈ <b>' + fmtInt(delta) + '</b> 权值。' +
      (p <= 0 ? ' <span class="z-hi">percent 必须大于 0。</span>' : '');
  }
  Array.prototype.forEach.call(modeInputs, function (i) {
    i.addEventListener('change', function () {
      var pair = currentMode() === 'pair';
      pairRow.classList.toggle('hidden', !pair);
      sentRow.classList.toggle('hidden', pair);
    });
  });
  percent.addEventListener('input', updatePreview);
  updatePreview();

  var btn2 = document.getElementById('adj-submit-2');
  var btn = document.getElementById('adj-submit') || btn2;
  if (!btn) return;
  var doSubmit = function () {
    var mode = currentMode();
    var dir = 'add';
    Array.prototype.forEach.call(document.querySelectorAll('input[name="adj-dir"]'), function (i) { if (i.checked) dir = i.value; });
    var p = parseFloat(percent.value);
    var msg = document.getElementById('adj-msg');
    if (!isFinite(p) || p <= 0 || p > 100) {
      banner(msg, 'error', '参数无效：', 'percent 必须在 0–100 之间（不含 0）'); return;
    }
    var body = { group: group, mode: mode, direction: dir, percent: p };
    if (mode === 'pair') {
      var f = (document.getElementById('adj-first').value || '').trim();
      var s = (document.getElementById('adj-second').value || '').trim();
      if (!f || !s) { banner(msg, 'error', '参数无效：', '两字模式请填写前字与后字'); return; }
      body.first = f; body.second = s;
    } else {
      var sentence = (document.getElementById('adj-sentence').value || '').trim();
      if (sentence.length < 2) { banner(msg, 'error', '参数无效：', '整句模式至少需要 2 个字符'); return; }
      body.sentence = sentence;
    }
    btn.disabled = true; btn.textContent = '提交中…';
    if (btn2) { btn2.disabled = true; btn2.textContent = '提交中…'; }
    request('POST', '/api/generate/adjust', null, body).then(function (data) {
      clearError();
      var r = data.report || {};
      banner(msg, 'ok', '调整成功：',
        '实际生效 ' + fmtInt(r.applied) + ' 条，删除 ' + fmtInt(r.deleted) + ' 条，' +
        'delta = ' + fmtInt(r.delta) + '（实际增减的权重绝对值，低于 0 的转移已被删除）；' +
        '总权值 ' + fmtInt(r.total_before) + ' → ' + fmtInt(r.total_after) + '。' +
        (state.genUser
          ? ' 注意：权重调整作用于整个群的聚合模型（chars 表），与当前 QQ ' + state.genUser + ' 筛选无关。'
          : ''));
      // 聚合表变了，下钻详情与两种作用域的 generate 缓存都要刷新
      cache.generate = null;
      if (state.pair) openPairDetail(group, state.pair.first, state.pair.second);
      refreshGeneratePanel(group);
    }).catch(function (err) {
      showError(err.message);
      banner(msg, 'error', '调整失败：', err.message);
    }).then(function () {
      btn.disabled = false; btn.textContent = '提交调整';
      if (btn2) { btn2.disabled = false; btn2.textContent = '提交调整'; }
    });
  };
  btn.addEventListener('click', doSubmit);
  if (btn2) btn2.addEventListener('click', doSubmit);
  // 两字输入支持 Enter 提交；IME 组合中不提交、不截断
  bindSubmitInput(document.getElementById('adj-first'), doSubmit);
  bindSubmitInput(document.getElementById('adj-second'), doSubmit);
  bindSubmitInput(document.getElementById('adj-sentence'), function (ev) {
    // 文本域里回车换行是合法输入，只有 Ctrl/Cmd+Enter 才提交
    if (ev && (ev.ctrlKey || ev.metaKey)) doSubmit();
  });
}

function refreshGeneratePanel(group) {

  var kept = keepMessages(['adj-msg']);

function wireExplore(group) {
  var btn = document.getElementById('ex-go');
  if (!btn) return;
  var input = document.getElementById('ex-char');
  var host = document.getElementById('explore-host');
  var msg = document.getElementById('ex-msg');

  function run() {
    var raw = String(input.value || '');
    if (!raw.trim()) { banner(msg, 'error', '请输入内容', '可以是单个字，也可以是拼音输入法打出的任意文本'); return; }
    // 提交时才取首字：用 Array.from 处理代理对（emoji / 生僻字），绝不在 input 事件里截断
    var chars = Array.from(raw.trim());
    var ch = chars[0] || '';
    if (chars.length > 1) input.value = ch;
    var taken = document.getElementById('ex-taken');
    if (taken) taken.innerHTML = '已取首字：<b>' + esc(ch) + '</b>' +
      (chars.length > 1 ? '（输入 ' + fmtInt(chars.length) + ' 个字符，其余已忽略）' : '');
    btn.disabled = true; btn.textContent = '分析中…';
    host.innerHTML = '<p class="sub">正在加载探索数据…</p>';
    var query = { group: group, char: ch };
    Object.keys(genUserParam()).forEach(function (k) { query[k] = genUserParam()[k]; });
    get('explore', '/api/generate/explore', query).then(function () {
      clearError();
      msg.innerHTML = '';
      renderExplore();
    }).catch(function (err) {
      showError(err.message);
      banner(msg, 'error', '分析失败：', err.message);
      host.innerHTML = '';
    }).then(function () { btn.disabled = false; btn.textContent = '分析'; });
  }
  btn.addEventListener('click', run);
  // IME 安全：组合中回车不提交，组合结束后也不主动触发分析
  bindSubmitInput(input, run);

  // 作用域变化后旧的探索结果已失效，不再自动重放
  if (cache.explore && cacheScopeMatches(cache.explore) &&
      String(cache.explore.char) === String(input.value || '')) renderExplore();
}

function renderExplore() {
  var host = document.getElementById('explore-host');
  if (!host) return;
  var d = cache.explore;
  if (!d) { host.innerHTML = ''; return; }
  var succ = d.successors || [], pred = d.predecessors || [];
  var scoped = state.genUser ? ('QQ ' + state.genUser) : '全部数据';
  var an = d.anomalies || {};
  var succAn = {};
  (an.successors && an.successors.high ? an.successors.high : []).forEach(function (r) { succAn[r.second] = r.z; });
  (an.successors && an.successors.low ? an.successors.low : []).forEach(function (r) { succAn[r.second] = r.z; });
  var predAn = {};
  (an.predecessors && an.predecessors.high ? an.predecessors.high : []).forEach(function (r) { predAn[r.first] = r.z; });
  (an.predecessors && an.predecessors.low ? an.predecessors.low : []).forEach(function (r) { predAn[r.first] = r.z; });

  var html = '';
  html += chips([
    chip('目标字符', text(d.char), ''),
    chip('出边总权值 out_total', fmtInt(d.out_total), ''),
    chip('入边总权值 in_total', fmtInt(d.in_total), ''),
    chip('分布熵 H', fmtNum(d.distribution_entropy, 4), 'bit'),
    chip('有效后继数 2^H', fmtNum(d.effective_support, 2), '个'),
    chip('80% 覆盖', (d.concentration && d.concentration.top80)
      ? ('前 ' + fmtInt(d.concentration.top80) + ' 种') : '—', ''),
    chip('作用域', scoped, ''),
    chip('后继 / 先驱种类', fmtInt(succ.length) + ' / ' + fmtInt(pred.length), '')
  ]);

  // 两张结构图在上、两张分布图在下，每行两张（够宽，不会被挤成竖条）
  html += '<div class="grid two tight">';

  html += '<div class="card dense">' +
    '<h2>P×S matrix<span class="aux">前驱 × 后继权重</span></h2>' +
    '<p class="sub">行 = 目标字与前驱（' + fmtInt(pred.length) + '），列 = 后继（' + fmtInt(succ.length) +
    '）；格内数字为权重，颜色为 viridis 映射。</p>' +
    '<canvas id="cv-ex-heat" style="width:100%;height:330px;display:block"></canvas>' +
    '</div>';

  html += '<div class="card dense">' +
    '<h2>Network<span class="aux">转移网络</span></h2>' +
    '<p class="sub">中心为目标字，左侧前驱、右侧后继；节点半径 ∝ √w，连线粗细 ∝ w。</p>' +
    '<canvas id="cv-ex-net" style="width:100%;height:330px;display:block"></canvas>' +
    '</div>';

  html += '<div class="card dense">' +
    '<h2>Zipf<span class="aux">排名–权重（log-log）</span></h2>' +
    '<p class="sub">越接近虚线（端点连线）越接近幂律。</p>' +
    '<canvas id="cv-ex-zipf" style="width:100%;height:280px;display:block"></canvas>' +
    '</div>';

  html += '<div class="card dense">' +
    '<h2>Lift<span class="aux">富集倍数</span></h2>' +
    '<p class="sub">lift 明显大于 1 = 该字特有搭配；≈1 = 只是全群高频字。</p>' +
    '<canvas id="cv-ex-lift" style="width:100%;height:280px;display:block"></canvas>' +
    '</div>';

  html += '</div>';

  html += '<div class="grid two tight" style="margin-top:16px">';
  html += listTable('后继列表（' + text(d.char) + ' → ?）', succ.map(function (r) {
    return { ch: r.second, w: r.w, share: r.share, z: succAn[r.second], first: d.char, second: r.second };
  }), '后继');

  html += listTable('先驱列表（? → ' + text(d.char) + '）', pred.map(function (r) {
    return { ch: r.first, w: r.w, share: r.share, z: predAn[r.first], first: r.first, second: d.char };
  }), '先驱');

  html += '</div>';
  host.innerHTML = html;

  var heat = document.getElementById('cv-ex-heat');
  if (heat) drawHeatmap(heat, d.heatmap);
  var net = document.getElementById('cv-ex-net');
  if (net) drawNetwork(net, d.graph, d.char);
  var zipf = document.getElementById('cv-ex-zipf');
  if (zipf) drawRankAbundance(zipf, succ);
  var lift = document.getElementById('cv-ex-lift');
  if (lift) drawLiftChart(lift, succ);
  // 表格行可点击 → 三级下钻
  Array.prototype.forEach.call(host.querySelectorAll('tr.rowlink'), function (tr) {
    var open = function () { openPairDetail(state.group, tr.dataset.first, tr.dataset.second); };
    tr.addEventListener('click', open);
    tr.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
    });
  });
}

function listTable(title, rows, chLabel) {
  return '<div class="card dense">' +
    '<h2>' + esc(title) + '<span class="aux">' + fmtInt(rows.length) + ' 条</span></h2>' +
    '<p class="sub">占比 share 相对该方向的权值总和；z 为 log10(w) 的 median/MAD 稳健 z 分数（阈值 ±3）。' +
    '<b>点击任意一行</b>可查看这条转移的排名与贡献者。</p>' +
    '<div class="scroll" style="max-height:300px"><table><thead><tr>' +
    '<th>' + esc(chLabel) + '</th><th class="r">权重 w</th><th class="r">占比 share</th><th class="r">z</th>' +
    '</tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) {
      var zCls = isNum(r.z) ? (r.z >= 3 ? 'z-hi' : (r.z <= -3 ? 'z-lo' : '')) : '';
      var canDrill = r.first !== undefined && r.second !== undefined;
      return '<tr' + (canDrill ? rowAttrs(r.first, r.second) : '') + '>' +
        '<td' + (canDrill ? ' class="drillcell"' : '') + '>' + esc(r.ch === '' ? '∅ 结束' : charLabel(r.ch)) + '</td>' +
        '<td class="r">' + fmtInt(r.w) + '</td>' +
        '<td class="r">' + fmtPct(r.share, 2) + '</td>' +
        '<td class="r ' + zCls + '">' + (isNum(r.z) ? fmtNum(r.z, 2) : DASH) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">暂无数据</td></tr>') +
    '</tbody></table></div></div>';
}

/* ---- 输出封禁对（prev, next）---------------------------------------------
   命中该相邻两字时，机器人截断生成并放弃整条回复。按群独立存储，因此卡片
   自带群选择器；只过滤模型生成的内容，系统固定提示不受影响。 */
function pbGroup() {
  var select = document.getElementById('pb-group');
  if (select && select.value) return select.value;
  if (state.pbGroup) return state.pbGroup;
  if (state.group) return state.group;
  var groups = (cache.overview && cache.overview.groups) || [];
  return groups.length ? groups[0].group : null;
}

function pairBanCardHtml() {
  var groups = (cache.overview && cache.overview.groups) || [];
  var html = '<div class="card" id="pb-card">' +
    '<h2>Pair bans<span class="aux">输出封禁对 · 按群独立</span></h2>' +
    '<p class="sub">当生成结果中出现下列相邻两字 <code>(prev, next)</code> 时，机器人会<b>立即截断生成并放弃这条回复</b>，' +
    '不发送任何内容。该守卫位于<b>出站路径</b>，因此被禁的字符对不可能被发出去。' +
    '只作用于模型生成的回复；封禁通知、<code>/apply</code> 等系统提示是固定文本，不受影响。</p>';
  if (!groups.length) {
    return html + '<p class="sub">正在加载群列表…</p></div>';
  }
  var options = groups.map(function (item) {
    var selected = String(item.group) === String(pbGroup()) ? ' selected' : '';
    return '<option value="' + esc(item.group) + '"' + selected + '>' +
      esc(item.label || item.group) + '</option>';
  }).join('');
  html += '<div class="toolbar">' +
    '<select id="pb-group">' + options + '</select>' +
    '<input type="text" id="pb-first" class="c1" placeholder="前字">' +
    '<input type="text" id="pb-second" class="c1" placeholder="后字">' +
    '<input type="text" id="pb-reason" placeholder="原因（可选）">' +
    '<button type="button" class="btn" id="pb-add">添加封禁对</button></div>' +
    '<div id="pb-msg"></div><div id="pb-list"></div></div>';
  return html;
}

function loadPairBans() {
  var host = document.getElementById('pb-list');
  var group = pbGroup();
  if (!host || !group) return;
  host.innerHTML = '<p class="sub">正在加载…</p>';
  request('GET', '/api/pairbans', { group: group }).then(function (data) {
    if (!document.getElementById('pb-list')) return;
    renderPairBans(data);
  }).catch(function (err) {
    host.innerHTML = '';
    banner(host, 'error', '加载封禁对失败：', err.message);
  });
}

function renderPairBans(data) {
  var host = document.getElementById('pb-list');
  if (!host) return;
  var bans = data.bans || [];
  if (!bans.length) {
    host.innerHTML = '<div class="banner ok" style="margin-bottom:0"><span class="head">暂无封禁对：</span>' +
      '该群的生成结果不做任何两字级别的出站拦截。</div>';
    return;
  }
  host.innerHTML = '<div class="scroll" style="max-height:280px"><table><thead><tr>' +
    '<th>前字</th><th>后字</th><th class="r">该对权重</th><th>原因</th><th>添加时间</th><th></th>' +
    '</tr></thead><tbody>' + bans.map(function (row) {
      return '<tr><td class="mono">' + esc(charLabel(row.first)) + '</td>' +
        '<td class="mono">' + esc(charLabel(row.second)) + '</td>' +
        '<td class="r">' + (row.weight === null ? '<span class="muted">未收录</span>' : fmtInt(row.weight)) + '</td>' +
        '<td>' + esc(row.reason || '—') + '</td>' +
        '<td>' + fmtTime(row.created_at) + '</td>' +
        '<td><button type="button" class="btn danger" data-pb-first="' + esc(row.first) +
        '" data-pb-second="' + esc(row.second) + '">解除</button></td></tr>';
    }).join('') + '</tbody></table></div>';
}

function bindPairBanCard() {
  var select = document.getElementById('pb-group');
  if (select) {
    select.addEventListener('change', function () {
      state.pbGroup = select.value;
      loadPairBans();
    });
  }
  var add = document.getElementById('pb-add');
  if (add) {
    add.addEventListener('click', function () {
      var group = pbGroup();
      var first = (document.getElementById('pb-first').value || '').trim();
      var second = (document.getElementById('pb-second').value || '').trim();
      var reason = (document.getElementById('pb-reason').value || '').trim();
      var box = document.getElementById('pb-msg');
      if (Array.from(first).length !== 1 || Array.from(second).length !== 1) {
        banner(box, 'error', '参数无效：', '前字与后字都必须恰好是 1 个字符'); return;
      }
      request('POST', '/api/pairbans', null,
        { group: group, first: first, second: second, reason: reason }).then(function () {
        document.getElementById('pb-first').value = '';
        document.getElementById('pb-second').value = '';
        document.getElementById('pb-reason').value = '';
        banner(box, 'ok', '已添加：', '命中 ' + first + ' → ' + second + ' 时将截断并放弃回复。');
        loadPairBans();
      }).catch(function (err) { banner(box, 'error', '添加失败：', err.message); });
    });
  }
  var list = document.getElementById('pb-list');
  if (list) {
    list.addEventListener('click', function (ev) {
      var button = ev.target.closest ? ev.target.closest('[data-pb-first]') : null;
      if (!button) return;
      var first = button.getAttribute('data-pb-first');
      var second = button.getAttribute('data-pb-second');
      request('POST', '/api/pairbans/delete', null,
        { group: pbGroup(), first: first, second: second }).then(function () {
        var box = document.getElementById('pb-msg');
        if (box) banner(box, 'ok', '已解除：', first + ' → ' + second + ' 不再拦截。');
        loadPairBans();
      }).catch(function (err) { showError(err.message); });
    });
  }
  loadPairBans();
}

function drawGradeTimeline(canvas, grades) {
  var c = fit(canvas);
  if (!c) return;
  var ctx = c.ctx;
  if (!grades.length) { drawNoData(ctx, 0, 0, c.w, c.h); return; }
  drawPanelLabel(ctx, 'A', 2, 2);
  var L = 12, R = c.w - 12, T = 34, B = c.h - 44;
  var maxSec = 1;
  grades.forEach(function (g) { maxSec = Math.max(maxSec, num(g.seconds, 0)); });
  var unit = (R - L) / grades.length;
  var gap = 8;
  var bw = Math.max(10, unit - gap);
  var H = B - T;

  grades.forEach(function (g, i) {
    var sec = num(g.seconds, 0);
    var frac = Math.sqrt(Math.max(0, sec) / maxSec);
    var h = Math.max(3, frac * H);
    var x = L + i * unit + (unit - bw) / 2;
    var y = B - h;
    var col = viridisCss(vmapT(i, grades.length));
    ctx.fillStyle = col;
    ctx.fillRect(x, y, bw, h);
    ctx.strokeStyle = AXIS;
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(bw) - 1, Math.max(Math.round(h), 1));
    ctx.font = boldFont(12);
    ctx.fillStyle = INK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(text(g.grade), x + bw / 2, y - 3);
    // 时长标注（条太矮时放到图下方统一轴）
    var lbl = fmtDurLabel(sec);
    var px = fitTextH(ctx, lbl, bw + 6, 10, tickFont, 8.5);
    ctx.font = tickFont(px);
    ctx.fillStyle = MUTED;
    ctx.textBaseline = 'top';
    ctx.fillText(lbl, x + bw / 2, B + 6);
    ctx.font = tickFont(10);
    ctx.fillStyle = MUTED;
    ctx.textBaseline = 'bottom';
    ctx.fillText(text(g.label), x + bw / 2, y - 18);
  });

  ctx.save();
  ctx.strokeStyle = AXIS;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(L, Math.round(B) + 0.5);
  ctx.lineTo(R, Math.round(B) + 0.5);
  ctx.stroke();
  ctx.font = labelFont(11);
  ctx.fillStyle = INK;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('条高 ∝ √封禁时长（右侧标实际时长）', L, B + 24);
  ctx.restore();
}

function wireGateReview() {
  var select=document.getElementById('gate-status');
  if (select) select.onchange=function () {
    state.gateStatus=select.value; state.gateReport=null;
    cache.gateReportDetail=null; cache.gatePageInfo=null;
    get('gateReports','/api/gate-reports',{status:state.gateStatus})
      .then(renderQuality).catch(function (err) { showError(err.message); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('.gate-open'),function (button) {
    button.onclick=function () { loadGateReport(button.dataset.id); };
  });
  var report=cache.gateReportDetail;
  if (!report || report.report_id !== state.gateReport) return;
  var approve=document.getElementById('report-approve');
  if (approve) approve.onclick=function () {
    var points=Number(document.getElementById('review-points').value);
    var ban=Number(document.getElementById('review-ban').value);
    var reviewer=document.getElementById('reviewer').value.trim();
    var reason=document.getElementById('review-reason').value.trim();
    if (!reviewer || !reason || !Number.isInteger(points) || points<0 || points>100 ||
        !Number.isInteger(ban) || ban<0 || ban>3600) {
      showError('请填写审核人、处理原因和有效的扣分/封禁秒数'); return;
    }
    approve.disabled=true;
    request('POST','/api/gate-report/approve',null,{report_id:report.report_id,
      reviewer:reviewer,reason:reason,points:points,ban_seconds:ban}).then(function () {
      state.gateReport=null; cache.gateReportDetail=null; cache.gatePageInfo=null;
      return Promise.all([get('gateReports','/api/gate-reports',{status:state.gateStatus}),
                          get('quality','/api/quality')]);
    }).then(renderQuality).catch(function (err) { showError(err.message); approve.disabled=false; });
  };
  var reject=document.getElementById('report-reject');
  if (reject) reject.onclick=function () {
    reject.disabled=true;
    request('POST','/api/gate-report/reject',null,{report_id:report.report_id})
      .then(function () { state.gateReport=null; cache.gateReportDetail=null;
        cache.gatePageInfo=null;
        return get('gateReports','/api/gate-reports',{status:state.gateStatus}); })
      .then(renderQuality).catch(function (err) { showError(err.message); reject.disabled=false; });
  };
}

    '</tbody></table></div></div>' +
    '<div class="card"><h2>所选用户的门禁事件</h2>' +
    '<div class="scroll tall"><table><thead><tr><th>时间</th><th>群</th><th>类别</th></tr></thead><tbody>' +
    (detail && detail.events.length ? detail.events.map(function (r) {
      return '<tr><td>' + fmtTime(r.at) + '</td><td>' + esc(groupLabel(r.group)) +
        '</td><td>' + esc(r.category) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">暂无事件</td></tr>') +
    '</tbody></table></div></div></div>';
  html += '<div class="grid one"><div class="card"><h2>分数调整历史</h2>' +
    '<p class="sub">记录人工改分的原分、新分、原因与时间。最近 30 条全局记录。</p>' +
    '<div class="scroll"><table><thead><tr><th>时间</th><th>QQ 号</th><th>变化</th><th>原因</th></tr></thead><tbody>' +
    ((q.changes || []).length ? q.changes.map(function (r) {
      return '<tr><td>' + fmtTime(r.at) + '</td><td class="mono">' + esc(r.user_id) +
        '</td><td>' + fmtInt(r.old_score) + ' → ' + fmtInt(r.score) +
        '</td><td>' + esc(r.reason) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">暂无调整记录</td></tr>') +
    '</tbody></table></div></div></div>';
  sec.innerHTML = html;
  wireGateReview();
  var find = document.getElementById('q-find');
  if (find) find.onclick = function () { loadQualityUser(document.getElementById('q-search').value); };
  var search = document.getElementById('q-search');
  if (search) search.onkeydown = function (ev) { if (ev.key === 'Enter') loadQualityUser(search.value); };
  Array.prototype.forEach.call(sec.querySelectorAll('.q-open'), function (button) {
    button.onclick = function () { loadQualityUser(button.dataset.user); };
  });
  var save = document.getElementById('q-save');
  if (save) save.onclick = function () {
    var user = document.getElementById('q-search').value.trim();
    var raw = document.getElementById('q-score').value.trim();
    var reason = document.getElementById('q-reason').value.trim();
    if (!/^[1-9][0-9]{4,12}$/.test(user) || !/^(100|[1-9]?[0-9])$/.test(raw) || !reason) {
      showError('请填写有效 QQ 号、0–100 整数分数和调整原因'); return;
    }
    save.disabled = true;
    request('POST','/api/quality/score',null,
      {user_id:user,score:Number(raw),reason:reason}).then(function () {
      clearError();
      return Promise.all([get('quality','/api/quality'),
        get('qualityDetail','/api/quality/user',{user_id:user})]);
    }).then(function () {
      state.qualityUser = user;
      renderQuality();
      var host = document.getElementById('q-message');
      if (host) banner(host,'ok','分数已保存。','训练和回复的新概率已生效。');
    }).catch(function (err) { showError(err.message); save.disabled = false; });
  };
}

    '整块重绘会把用户正在看的结果和正在填的内容清空。焦点在输入框内时也不会刷新。</p>' +

    '<div class="scroll" style="max-height:280px"><table>' +

    ((d.databases || []).length ? (d.databases || []).map(function (row) {
      return '<tr><td>' + esc(groupLabel(row.group)) + '<div class="muted mono">' + esc(text(row.group)) + '</div></td>' +
        '<td class="mono">' + esc(text(row.file)) + '</td>' +
        '<td class="r">' + fmtInt(row.bytes) + '</td>' +
        '<td class="r">' + fmtBytes(row.bytes) + '</td></tr>';
    }).join('') : '<tr><td colspan="4" class="empty">暂无数据</td></tr>') +
    '</tbody></table></div></div>';
  html += '</div>';

  var q = d.quality || {status:'未初始化',users:[],categories:[]};
  html += '<div class="grid">' +
    '<div class="card"><h2>用户质量分</h2>' +
    '<p class="sub">当前状态：' + esc(text(q.status)) +
    '。01/02 门禁已记录；训练与模型回复分别按质量分抽样。校准前所有用户初始为 100 分，不降低概率。</p>' +
    '<div class="scroll" style="max-height:260px"><table>' +
    '<thead><tr><th>QQ 号</th><th class="r">分数 / 100</th><th class="r">门禁事件</th></tr></thead><tbody>' +
    ((q.users || []).length ? q.users.map(function (row) {
      return '<tr><td class="mono">' + esc(text(row.user_id)) + '</td>' +
        '<td class="r">' + fmtInt(row.score) + '</td>' +
        '<td class="r">' + fmtInt(row.gate_events) + '</td></tr>';
    }).join('') : '<tr><td colspan="3" class="empty">暂无用户记录</td></tr>') +
    '</tbody></table></div></div>' +
    '<div class="card"><h2>门禁与表情缓存</h2>' +
    '<p class="sub">01 长消息；02 封禁后首条消息。表情只缓存明确标记的表情包。</p>' +
    '<div class="scroll" style="max-height:260px"><table>' +
    '<thead><tr><th>门禁类别</th><th class="r">事件数</th></tr></thead><tbody>' +
    ((q.categories || []).length ? q.categories.map(function (row) {
      return '<tr><td>' + esc(text(row.category)) + '</td><td class="r">' +
        fmtInt(row.count) + '</td></tr>';
    }).join('') : '<tr><td colspan="2" class="empty">暂无触发记录</td></tr>') +
    '</tbody></table></div>' +
    '<p class="hint">各群表情缓存：' +
    ((d.stickers || []).length ? d.stickers.map(function (row) {
      return esc(groupLabel(row.group)) + ' ' + fmtInt(row.assets) + ' 张';
    }).join('；') : '暂无') + '</p></div></div>';

  html += '<div class="grid one"><div class="card">' +
    '<div class="card-head"><div class="grow">' +
      '<h2>运行日志<span class="aux">runtime/bot.log，最多 120 行</span></h2>' +
      '<p class="sub">日志以 textContent 写入，不会被当作 HTML 解析。</p>' +
    '</div>' +
    '<div><button type="button" class="btn" id="log-refresh">刷新日志</button></div>' +

    '<p class="hint" id="log-meta"></p>' +
    '<pre class="log" id="log-pre"></pre>' +
    '</div></div>';

  sec.innerHTML = html;
  wireSystemSwitch();
  var lr = document.getElementById('log-refresh');
  if (lr) lr.addEventListener('click', function () { loadLog(true); });
  renderLog();
}

function wireSystemSwitch() {
  var box = document.getElementById('sys-auto');
  if (!box) return;
  box.addEventListener('change', function () {
    state.auto = box.checked;
    try { localStorage.setItem('qbot.auto', state.auto ? '1' : '0'); } catch (e) { /* 忽略 */ }
    updateFoot();
  });
}

function renderLog() {
  var pre = document.getElementById('log-pre');
  if (!pre) return;
  var lines = (cache.log && cache.log.lines) || [];
  var meta = document.getElementById('log-meta');
  if (!lines.length) {
    pre.textContent = '暂无日志（runtime/bot.log 不存在或为空）';
    if (meta) meta.textContent = '';
    return;
  }
  pre.textContent = lines.join('\n');
  if (meta) meta.textContent = '共 ' + lines.length + ' 行（末尾 120 行）';
}

function loadLog(force) {
  return get('log', '/api/log').then(function () {
    if (state.page === 'system') renderLog();
  }).catch(function (err) {
    if (state.page === 'system') {
      var pre = document.getElementById('log-pre');
      if (pre) pre.textContent = '加载日志失败：' + err.message;
    }
    showError(err.message);
  });
}

/* =========================================================================
 * 12. 刷新调度 / 渲染分发 / 事件
 * ====================================================================== */
function updateFoot() {
  foot.textContent = '自动刷新：' + (state.auto ? '已开启（训练页除外）' : '已关闭') +
    ' · 最近刷新时间：' + (state.lastRefresh ? fmtTime(state.lastRefresh / 1000) : '—') +
    ' · 接口 GET /api/overview /api/bans /api/match /api/generate /api/dictionary /api/system';
  var last = document.getElementById('sys-last');
  if (last) last.textContent = state.lastRefresh ? fmtTime(state.lastRefresh / 1000) : DASH;
}

/* 自动刷新会重建当前页 DOM，因此渲染前先保存用户正在填写的值与勾选状态，
   渲染后原样贴回；否则输入框会被无故清空。 */
function snapshotFields() {
  var kept = {};
  var nodes = document.querySelectorAll('input[id], textarea[id], select[id]');
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    if (node.type === 'checkbox' || node.type === 'radio') kept[node.id] = { checked: node.checked };
    else kept[node.id] = { value: node.value };
  }
  return kept;
}

function restoreFields(kept) {
  if (!kept) return;
  Object.keys(kept).forEach(function (id) {
    var node = document.getElementById(id);
    if (!node) return;
    var saved = kept[id];
    if (Object.prototype.hasOwnProperty.call(saved, 'checked')) node.checked = saved.checked;
    else if (node.value !== saved.value) node.value = saved.value;
  });
}

/** 自动刷新只允许作用于这些「纯展示」页面 */
var AUTO_PAGES = { system: true };

/** 焦点在输入控件上时绝不重绘，避免打断输入法的组合输入。 */
function typingNow() {
  var el = document.activeElement;
  if (!el || !el.tagName) return false;
  var tag = el.tagName.toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable === true;
}

function refreshCurrent(silent) {
  var page = state.page;
  var tasks = [];
  tasks.push(get('overview', '/api/overview').catch(function (err) {
    showError(err.message);
    return null;
  }));
  if (page === 'bans' && state.group) {
    tasks.push(get('bans', '/api/bans', { group: state.group }).catch(function (err) {
      showError(err.message); return null;
    }));
  }
  if (page === 'train' && state.group) {
    tasks.push(get('match', '/api/match', { group: state.group }).catch(function (err) {
      showError(err.message); return null;
    }));
    var gq = { group: state.group };
    Object.keys(genUserParam()).forEach(function (k) { gq[k] = genUserParam()[k]; });
    tasks.push(get('generate', '/api/generate', gq).catch(function (err) {
      showError(err.message); return null;
    }));
    tasks.push(get('generateUsers', '/api/generate/users', { group: state.group }).catch(function (err) {
      showError(err.message); return null;
    }));
  }
  if (page === 'dict') {
    tasks.push(get('dict', '/api/gates').catch(function (err) { showError(err.message); return null; }));
  }
  if (page === 'system') {
    tasks.push(get('system', '/api/system').catch(function (err) { showError(err.message); return null; }));
    tasks.push(get('log', '/api/log').catch(function (err) { showError(err.message); return null; }));
  }
  if (page === 'quality') {
    tasks.push(get('quality', '/api/quality').catch(function (err) { showError(err.message); return null; }));
    tasks.push(get('gateReports','/api/gate-reports',{status:state.gateStatus})
      .catch(function (err) { showError(err.message); return null; }));
    if (state.qualityUser) tasks.push(get('qualityDetail', '/api/quality/user',
      {user_id:state.qualityUser}).catch(function (err) { showError(err.message); return null; }));
  }
  return Promise.all(tasks).then(function () {
    state.lastRefresh = Date.now();
    updateFoot();
    if (state.page === page) {
      var kept = snapshotFields();
      renderPage();
      restoreFields(kept);
    }
  });
}

function renderPage() {
  clearErrorUnless();
  if (state.page === 'overview') renderOverview();
  else if (state.page === 'bans') renderBans();
  else if (state.page === 'train') renderTrain();
  else if (state.page === 'dict') renderDict();
  else if (state.page === 'quality') renderQuality();
  else if (state.page === 'system') renderSystem();
  renderBanners();
}

/** 切页时清掉上一页的残留错误（1.5 秒内的新错误保留） */
function clearErrorUnless() {
  if (GLOBAL_ERROR && Date.now() - errorStamp > 1500) { GLOBAL_ERROR = ''; errorStamp = 0; }
}

function switchPage(page) {
  if (PAGES.indexOf(page) < 0) page = 'overview';
  state.page = page;
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.classList.toggle('on', b.dataset.page === page);
  });
  PAGES.forEach(function (p) {
    var el = document.getElementById('page-' + p);
    if (el) el.classList.toggle('hidden', p !== page);
  });
  GLOBAL_ERROR = '';
  if (page === 'train') { cache.match = null; cache.generate = null; cache.generateUsers = null; }
  else state.pair = null;   // 离开训练页时收起下钻详情
  renderPage();
  refreshCurrent(true);
  try { history.replaceState(null, '', '#' + page); } catch (e) { /* file:// 下可能受限 */ }
}

function renderAll() {
  renderShell();
  renderPage();
}

/* 标签页导航 */
var tabsBar = document.getElementById('tabs');
if (tabsBar) tabsBar.addEventListener('click', function (ev) {
  var btn = ev.target.closest('button[data-page]');
  if (btn) switchPage(btn.dataset.page);
});

window.addEventListener('hashchange', function () {
  var p = (location.hash || '').replace('#', '');
  if (PAGES.indexOf(p) >= 0 && p !== state.page) switchPage(p);
});

/* 窗口尺寸变化：防抖后重绘当前页所有 canvas */
var resizeTimer = null;
window.addEventListener('resize', function () {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () { redrawCanvas(); }, 150);
});

function redrawCanvas() {
  if (state.page === 'overview') drawOverviewCharts();
  else if (state.page === 'train') {
    if (state.trainTab === 'match') drawMatchCharts(cache.match);
    else {
      drawGenerateCharts(cacheScopeMatches(cache.generate) ? cache.generate : null);
      if (cache.explore && cacheScopeMatches(cache.explore) && document.getElementById('cv-ex-heat')) {
        drawHeatmap(document.getElementById('cv-ex-heat'), cache.explore.heatmap);
        drawNetwork(document.getElementById('cv-ex-net'), cache.explore.graph, cache.explore.char);
        var zc = document.getElementById('cv-ex-zipf');
        if (zc) drawRankAbundance(zc, cache.explore.successors || []);
        var lc = document.getElementById('cv-ex-lift');
        if (lc) drawLiftChart(lc, cache.explore.successors || []);
      }
      var pcv = document.getElementById('cv-pair-contrib');
      if (pcv && cache.pairDetail && cache.pairDetail.contributors) {
        drawContributorChart(pcv, cache.pairDetail.contributors, num(cache.pairDetail.weight, 0));
      }
    }
  } else if (state.page === 'dict') {
    var cv = document.getElementById('cv-dict-grades');
    if (cv && cache.dict) drawGradeTimeline(cv, cache.dict.grades || []);
  }
}

/* 自动刷新：只作用于「纯展示」页面 —— 训练页承载输入框、单字探索结果与转移下钻详情，
   封禁页承载表单，整块重绘都会把用户正在看的内容与正在填的内容刷走，因此这两页永不自动刷新。 */
setInterval(function () {
  if (!state.auto) return;
  if (typeof document.hidden === 'boolean' && document.hidden) return;
  if (!AUTO_PAGES[state.page]) return;
  if (typingNow()) return;
  refreshCurrent(true);
}, 10000);

/* 启动 */
(function boot() {
  var p = (location.hash || '').replace('#', '');
  if (PAGES.indexOf(p) >= 0) state.page = p;
  renderAll();
  switchPage(state.page);
  updateFoot();
})();
})();
</script>
